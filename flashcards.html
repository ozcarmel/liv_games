<title>קופסת הכרטיסיות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #f2effa;
    --surface: #ffffff;
    --surface-soft: #faf8fd;
    --ink: #2b2440;
    --ink-soft: #6b6280;
    --accent: #6c4fd1;
    --accent-ink: #ffffff;
    --good: #1f9c5a;
    --good-bg: #e3f7ec;
    --bad: #d93f52;
    --bad-bg: #fcebec;
    --border: #e3def4;
    --card-ink: #2b2440;
    --card-1: #ffd166;
    --card-2: #ff8fa3;
    --card-3: #4ecdc4;
    --card-4: #7eb8f0;
    --card-5: #c9a6f2;
    --shadow: 0 10px 30px -12px rgba(43, 36, 64, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1830;
      --surface: #262042;
      --surface-soft: #241f3c;
      --ink: #f3effa;
      --ink-soft: #b6add1;
      --accent: #a98cf5;
      --accent-ink: #201a38;
      --good: #4fd895;
      --good-bg: #1c3a2d;
      --bad: #ff8390;
      --bad-bg: #3b2030;
      --border: #3a3360;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1c1830;
    --surface: #262042;
    --surface-soft: #241f3c;
    --ink: #f3effa;
    --ink-soft: #b6add1;
    --accent: #a98cf5;
    --accent-ink: #201a38;
    --good: #4fd895;
    --good-bg: #1c3a2d;
    --bad: #ff8390;
    --bad-bg: #3b2030;
    --border: #3a3360;
    --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Heebo', 'Segoe UI', sans-serif;
    direction: rtl;
    padding: 28px 18px 60px;
    min-height: 100vh;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  h1 {
    font-family: 'Secular One', 'Heebo', sans-serif;
    font-size: clamp(32px, 6vw, 46px);
    margin: 0 0 6px;
    color: var(--accent);
    text-wrap: balance;
  }

  .tagline {
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
  }

  .statbar {
    position: sticky;
    top: 12px;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 18px;
    box-shadow: var(--shadow);
    margin: 22px 0;
  }

  .stat-figures {
    display: flex;
    gap: 18px;
    align-items: baseline;
    font-variant-numeric: tabular-nums;
  }

  .stat-figures b {
    font-size: 22px;
    color: var(--ink);
  }

  .stat-figures span.label {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 14px;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .finish-banner {
    display: none;
    background: linear-gradient(135deg, var(--accent), #9b6bd1);
    color: #fff;
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 22px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .finish-banner.show { display: block; }
  .finish-banner .big { font-family: 'Secular One', sans-serif; font-size: 34px; display: block; margin-bottom: 2px; font-variant-numeric: tabular-nums; }

  .add-card {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 26px;
  }

  .add-card h2 {
    margin: 0 0 12px;
    font-size: 15px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .add-grid {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    align-items: start;
  }

  @media (max-width: 640px) {
    .add-grid { grid-template-columns: 1fr; }
  }

  textarea {
    width: 100%;
    resize: vertical;
    min-height: 54px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .add-submit {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 0 20px;
    height: 54px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .add-submit:hover { filter: brightness(1.08); }
  .add-submit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .tip button {
    margin-right: auto;
    margin-left: 0;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 50px 20px;
    font-size: 16px;
  }

  .card-slot {
    perspective: 1300px;
    min-height: 190px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 190px;
    transition: transform 0.55s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card-slot.flipped .card-inner { transform: rotateY(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .card-inner { transition: none; }
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    color: var(--card-ink);
    box-shadow: var(--shadow);
    border: 3px solid transparent;
  }

  .face.back { transform: rotateY(180deg); }

  .face .kind {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.65;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .face .text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.45;
    flex: 1;
    overflow-y: auto;
  }

  .face .hint {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 8px;
  }

  .del-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.55);
    color: var(--card-ink);
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .del-btn:hover { background: rgba(255,255,255,0.85); }

  .judge-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .judge-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 9px 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: rgba(255,255,255,0.55);
    color: var(--card-ink);
    transition: transform 0.1s, background 0.15s;
  }
  .judge-btn:hover { background: rgba(255,255,255,0.85); }
  .judge-btn:active { transform: scale(0.96); }
  .judge-btn.active-good { background: var(--good); color: #fff; }
  .judge-btn.active-bad { background: var(--bad); color: #fff; }
  .judge-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .card-slot[data-status="good"] .face { border-color: var(--good); }
  .card-slot[data-status="bad"] .face { border-color: var(--bad); }

  .card-slot:nth-child(5n+1) .face { background: var(--card-1); }
  .card-slot:nth-child(5n+2) .face { background: var(--card-2); }
  .card-slot:nth-child(5n+3) .face { background: var(--card-3); }
  .card-slot:nth-child(5n+4) .face { background: var(--card-4); }
  .card-slot:nth-child(5n+5) .face { background: var(--card-5); }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 40px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .tab-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grade-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .grade-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: 'Secular One', sans-serif;
    font-size: 18px;
    cursor: pointer;
  }
  .grade-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .grade-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
  }

  .topic-card {
    border: none;
    border-radius: 16px;
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    color: var(--card-ink);
    box-shadow: var(--shadow);
    font-family: inherit;
  }
  .topic-card .emoji { font-size: 28px; display: block; margin-bottom: 8px; }
  .topic-card .name { font-weight: 700; font-size: 15px; }
  .topic-card:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .topic-card:nth-child(10n+1) { background: var(--card-1); }
  .topic-card:nth-child(10n+2) { background: var(--card-2); }
  .topic-card:nth-child(10n+3) { background: var(--card-3); }
  .topic-card:nth-child(10n+4) { background: var(--card-4); }
  .topic-card:nth-child(10n+5) { background: var(--card-5); }
  .topic-card:nth-child(10n+6) { background: var(--card-2); }
  .topic-card:nth-child(10n+7) { background: var(--card-4); }
  .topic-card:nth-child(10n+8) { background: var(--card-1); }
  .topic-card:nth-child(10n+9) { background: var(--card-5); }
  .topic-card:nth-child(10n+10) { background: var(--card-3); }

  .deck-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .deck-title {
    font-weight: 700;
    font-size: 18px;
  }

  [hidden] { display: none !important; }
</style>

<div class="wrap">
  <header>
    <h1>קופסת הכרטיסיות</h1>
    <p class="tagline">בחרי כיתה ונושא, או הוסיפי כרטיסיות משלך — ותרגלי בלחיצה</p>
  </header>

  <div class="tabs">
    <button class="tab-btn" id="tabTopics" type="button">📚 נושאים לפי כיתה</button>
    <button class="tab-btn" id="tabCustom" type="button">✏️ הכרטיסיות שלי</button>
  </div>

  <div class="finish-banner" id="finishBanner">
    <span class="big" id="finishPct">0%</span>
    <span id="finishText"></span>
  </div>

  <div class="statbar" id="statbar" hidden>
    <div class="stat-figures">
      <span><b id="statAnswered">0</b> <span class="label">נענו</span></span>
      <span><b id="statCorrect">0</b> <span class="label">נכון</span></span>
      <span><b id="statTotal">0</b> <span class="label">סה״כ כרטיסיות</span></span>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">🔄 סבב חדש</button>
  </div>

  <!-- panel: topics by grade -->
  <div id="panelTopics">
    <div class="grade-row" id="gradeRow"></div>
    <div id="topicGrid" class="topic-grid"></div>
    <div id="deckArea" hidden>
      <div class="deck-header">
        <button class="back-btn" id="backBtn" type="button">← חזרה לנושאים</button>
        <span class="deck-title" id="deckTitle"></span>
      </div>
      <div class="grid" id="topicCardsGrid"></div>
    </div>
  </div>

  <!-- panel: custom cards -->
  <div id="panelCustom" hidden>
    <div class="tip" id="tip" hidden>
      <span>💡 אלו כמה כרטיסיות לדוגמה כדי שתתחילי להתנסות. אפשר למחוק אותן ולהוסיף משלך.</span>
      <button id="tipClose" type="button" aria-label="סגירה">✕</button>
    </div>

    <form class="add-card" id="addForm">
      <h2>הוספת כרטיסייה חדשה</h2>
      <div class="add-grid">
        <textarea id="qInput" placeholder="שאלה..." required></textarea>
        <textarea id="aInput" placeholder="תשובה..." required></textarea>
        <button class="add-submit" type="submit">➕ הוספה</button>
      </div>
    </form>

    <div class="grid" id="grid"></div>
  </div>

  <footer>הכרטיסיות נשמרות אוטומטית בדפדפן הזה</footer>
</div>

<script src="data.js"></script>
<script>
  const STORAGE_KEY = 'flashcards-he-v1';
  const TIP_KEY = 'flashcards-he-tip-dismissed';

  const seed = [
    { id: 's1', q: 'מהי בירת אוסטרליה?', a: 'קנברה (לא סידני!)', status: null },
    { id: 's2', q: 'כמה עצמות יש בגוף אדם בוגר?', a: '206 עצמות', status: null },
    { id: 's3', q: 'מי כתב את "רומיאו ויוליה"?', a: 'ויליאם שייקספיר', status: null },
    { id: 's4', q: 'מהו הסימן הכימי של ברזל?', a: 'Fe', status: null },
  ];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return seed.map(c => ({ ...c }));
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch (e) {}
  }

  let cards = load();

  // shared elements
  const grid = document.getElementById('grid');
  const statbar = document.getElementById('statbar');
  const statAnswered = document.getElementById('statAnswered');
  const statCorrect = document.getElementById('statCorrect');
  const statTotal = document.getElementById('statTotal');
  const finishBanner = document.getElementById('finishBanner');
  const finishPct = document.getElementById('finishPct');
  const finishText = document.getElementById('finishText');
  const tip = document.getElementById('tip');
  const resetBtn = document.getElementById('resetBtn');

  // tabs / panels
  const tabTopics = document.getElementById('tabTopics');
  const tabCustom = document.getElementById('tabCustom');
  const panelTopics = document.getElementById('panelTopics');
  const panelCustom = document.getElementById('panelCustom');

  // topics-by-grade elements
  const gradeRow = document.getElementById('gradeRow');
  const topicGridEl = document.getElementById('topicGrid');
  const deckArea = document.getElementById('deckArea');
  const topicCardsGrid = document.getElementById('topicCardsGrid');
  const deckTitle = document.getElementById('deckTitle');
  const backBtn = document.getElementById('backBtn');

  let mode = 'topics';
  let selectedGrade = GRADES[0];
  let selectedTopicId = null;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function computeStats(statuses) {
    const total = statuses.length;
    const answered = statuses.filter(Boolean).length;
    const correct = statuses.filter(s => s === 'good').length;
    return { total, answered, correct };
  }

  function updateStatsUI(stats) {
    statAnswered.textContent = stats.answered;
    statCorrect.textContent = stats.correct;
    statTotal.textContent = stats.total;

    if (stats.total > 0 && stats.answered === stats.total) {
      const pct = Math.round((stats.correct / stats.total) * 100);
      finishPct.textContent = pct + '%';
      let msg;
      if (pct >= 80) msg = 'מעולה! את מוכנה למבחן 🎉';
      else if (pct >= 50) msg = 'לא רע, עוד קצת תרגול ותהיי מושלמת 👍';
      else msg = 'כדאי לעבור שוב על הכרטיסיות שטעית בהן 💪';
      finishText.textContent = `${stats.correct} מתוך ${stats.total} נכון — ${msg}`;
      finishBanner.classList.add('show');
    } else {
      finishBanner.classList.remove('show');
    }
  }

  function buildSlot(q, a, status, onJudge, onDelete) {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    if (status) slot.dataset.status = status;

    slot.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          ${onDelete ? '<button class="del-btn" type="button" aria-label="מחיקת כרטיסייה">✕</button>' : ''}
          <div class="kind">שאלה</div>
          <div class="text">${escapeHtml(q)}</div>
          <div class="hint">לחצי כדי לראות את התשובה</div>
        </div>
        <div class="face back">
          ${onDelete ? '<button class="del-btn" type="button" aria-label="מחיקת כרטיסייה">✕</button>' : ''}
          <div class="kind">תשובה</div>
          <div class="text">${escapeHtml(a)}</div>
          <div class="judge-row">
            <button class="judge-btn judge-good ${status === 'good' ? 'active-good' : ''}" type="button">✔ ידעתי</button>
            <button class="judge-btn judge-bad ${status === 'bad' ? 'active-bad' : ''}" type="button">✖ טעיתי</button>
          </div>
        </div>
      </div>
    `;

    const inner = slot.querySelector('.card-inner');
    inner.addEventListener('click', () => slot.classList.toggle('flipped'));

    if (onDelete) {
      slot.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); onDelete(); });
      });
    }

    slot.querySelector('.judge-good').addEventListener('click', (e) => {
      e.stopPropagation();
      onJudge(status === 'good' ? null : 'good');
    });
    slot.querySelector('.judge-bad').addEventListener('click', (e) => {
      e.stopPropagation();
      onJudge(status === 'bad' ? null : 'bad');
    });

    return slot;
  }

  // ---------- custom cards (panelCustom) ----------

  function isSeeded() {
    return cards.length > 0 && cards.every(c => c.id.startsWith('s') && seed.some(s => s.id === c.id));
  }

  function renderTip() {
    const dismissed = localStorage.getItem(TIP_KEY) === '1';
    tip.hidden = dismissed || !isSeeded();
  }

  function renderCustom() {
    grid.innerHTML = '';
    if (cards.length === 0) {
      grid.innerHTML = '<div class="empty">אין עדיין כרטיסיות — הוסיפי אחת למעלה כדי להתחיל ✏️</div>';
    }
    cards.forEach(card => {
      const slot = buildSlot(
        card.q, card.a, card.status,
        (newStatus) => { card.status = newStatus; save(); renderCustom(); },
        () => { cards = cards.filter(c => c.id !== card.id); save(); renderCustom(); }
      );
      grid.appendChild(slot);
    });

    statbar.hidden = false;
    updateStatsUI(computeStats(cards.map(c => c.status)));
    renderTip();
  }

  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const qInput = document.getElementById('qInput');
    const aInput = document.getElementById('aInput');
    const q = qInput.value.trim();
    const a = aInput.value.trim();
    if (!q || !a) return;
    cards.push({ id: 'c' + Date.now() + Math.random().toString(16).slice(2), q, a, status: null });
    qInput.value = '';
    aInput.value = '';
    save();
    renderCustom();
    qInput.focus();
  });

  document.getElementById('tipClose').addEventListener('click', () => {
    localStorage.setItem(TIP_KEY, '1');
    tip.hidden = true;
  });

  // ---------- topics by grade (panelTopics) ----------

  function deckKey(topicId, grade) { return topicId + '_' + grade; }
  function statusStorageKey(topicId, grade) { return 'fc-topic-status-' + deckKey(topicId, grade); }

  function loadTopicStatuses(topicId, grade, length) {
    try {
      const raw = localStorage.getItem(statusStorageKey(topicId, grade));
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length === length) return arr;
      }
    } catch (e) {}
    return new Array(length).fill(null);
  }

  function saveTopicStatuses(topicId, grade, statuses) {
    try { localStorage.setItem(statusStorageKey(topicId, grade), JSON.stringify(statuses)); } catch (e) {}
  }

  function renderGradeRow() {
    gradeRow.innerHTML = '';
    GRADES.forEach(g => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'grade-btn' + (g === selectedGrade ? ' active' : '');
      btn.textContent = g;
      btn.addEventListener('click', () => {
        selectedGrade = g;
        selectedTopicId = null;
        showTopicGrid();
      });
      gradeRow.appendChild(btn);
    });
  }

  function renderTopicGrid() {
    topicGridEl.innerHTML = '';
    TOPICS.forEach(topic => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'topic-card';
      btn.innerHTML = `<span class="emoji">${topic.emoji}</span><span class="name">${escapeHtml(topic.name)}</span>`;
      btn.addEventListener('click', () => openTopicDeck(topic.id));
      topicGridEl.appendChild(btn);
    });
  }

  function showTopicGrid() {
    selectedTopicId = null;
    deckArea.hidden = true;
    gradeRow.hidden = false;
    topicGridEl.hidden = false;
    statbar.hidden = true;
    finishBanner.classList.remove('show');
    renderGradeRow();
  }

  function openTopicDeck(topicId) {
    selectedTopicId = topicId;
    gradeRow.hidden = true;
    topicGridEl.hidden = true;
    deckArea.hidden = false;
    renderTopicDeck();
  }

  function renderTopicDeck() {
    const topic = TOPICS.find(t => t.id === selectedTopicId);
    const items = DECKS[deckKey(selectedTopicId, selectedGrade)] || [];
    const statuses = loadTopicStatuses(selectedTopicId, selectedGrade, items.length);

    deckTitle.textContent = `${topic.emoji} ${topic.name} · כיתה ${selectedGrade}`;
    topicCardsGrid.innerHTML = '';
    items.forEach((item, idx) => {
      const slot = buildSlot(
        item.q, item.a, statuses[idx],
        (newStatus) => {
          statuses[idx] = newStatus;
          saveTopicStatuses(selectedTopicId, selectedGrade, statuses);
          renderTopicDeck();
        },
        null
      );
      topicCardsGrid.appendChild(slot);
    });

    statbar.hidden = false;
    updateStatsUI(computeStats(statuses));
  }

  backBtn.addEventListener('click', showTopicGrid);

  // ---------- mode switching ----------

  function setMode(m) {
    mode = m;
    tabTopics.classList.toggle('active', m === 'topics');
    tabCustom.classList.toggle('active', m === 'custom');
    panelTopics.hidden = m !== 'topics';
    panelCustom.hidden = m !== 'custom';

    if (m === 'custom') {
      renderCustom();
    } else if (selectedTopicId) {
      renderTopicDeck();
    } else {
      showTopicGrid();
    }
  }

  tabTopics.addEventListener('click', () => setMode('topics'));
  tabCustom.addEventListener('click', () => setMode('custom'));

  resetBtn.addEventListener('click', () => {
    if (mode === 'custom') {
      cards.forEach(c => c.status = null);
      save();
      renderCustom();
    } else if (selectedTopicId) {
      const items = DECKS[deckKey(selectedTopicId, selectedGrade)] || [];
      saveTopicStatuses(selectedTopicId, selectedGrade, new Array(items.length).fill(null));
      renderTopicDeck();
    }
  });

  // ---------- init ----------
  renderTopicGrid();
  setMode('topics');
</script>
