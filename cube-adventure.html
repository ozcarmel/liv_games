<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הרפתקת הקוביות</title>
<style>
  body { margin: 0; background: #1d2433; color: #fff; font-family: Arial, sans-serif; text-align: center; }
  h1 { margin: 10px 0 4px; font-size: 24px; }
  #bar { display: flex; justify-content: center; gap: 24px; font-size: 18px; margin: 4px 0; }
  canvas { background: #87ceeb; border: 3px solid #fff; max-width: 98vw; cursor: crosshair; }
  p { max-width: 900px; margin: 6px auto; font-size: 15px; line-height: 1.5; }
  button { font-size: 16px; padding: 6px 16px; border-radius: 8px; border: 0; cursor: pointer; }
</style>
</head>
<body>
<h1>הרפתקת הקוביות</h1>
<div id="bar">
  <span id="hearts"></span>
  <span>⭐ <b id="stars">0</b> / <b id="total">0</b></span>
  <span>🧱 קוביות: <b id="blocks">0</b></span>
  <button id="restart">משחק חדש</button>
</div>
<canvas id="game" width="960" height="540"></canvas>
<p>
  <b>מטרה:</b> לאסוף את כל הכוכבים. <b>הליכה:</b> חיצים או A ו-D. <b>קפיצה:</b> רווח, חץ למעלה או W.
  <b>עכבר:</b> לחיצה על קובייה חופרת אותה (ומוסיפה לספירה), לחיצה על מקום ריק בונה קובייה.
  קפצו על הנחשים מלמעלה כדי לנצח אותם, ואל תיגעו בהם מהצד!
</p>
<script>
// ---------- הגדרות בסיסיות ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const T = 32;                 // גודל קובייה אחת בפיקסלים
const W = 120, H = 30;        // גודל העולם בקוביות
const REACH = 5 * T;          // כמה רחוק אפשר לחפור או לבנות

// סוגי קוביות: 0 אוויר, 1 דשא, 2 אדמה, 3 אבן, 4 עץ (שבנינו)
const COLORS = { 1: '#4caf50', 2: '#8d5a2b', 3: '#7d8590', 4: '#c8913a' };

let world, player, snakes, stars, camX, camY = 0, hearts, blocks, collected, state, mouse, keys = {};

// ---------- יצירת עולם חדש ----------
function surfaceY(x) {
  return Math.round(15 + Math.sin(x * 0.15) * 2 + Math.sin(x * 0.05 + 1) * 3);
}

function newGame() {
  world = [];
  for (let y = 0; y < H; y++) world.push(new Array(W).fill(0));
  for (let x = 0; x < W; x++) {
    const s = surfaceY(x);
    for (let y = s; y < H; y++) world[y][x] = y === s ? 1 : (y < s + 4 ? 2 : 3);
  }
  // מערות קטנות באדמה
  for (let i = 0; i < 25; i++) {
    const cx = 3 + Math.floor(Math.random() * (W - 6)), cy = surfaceY(cx) + 5 + Math.floor(Math.random() * 6);
    for (let dx = -1; dx <= 1; dx++) for (let dy = 0; dy <= 1; dy++)
      if (cy + dy < H - 1) world[cy + dy][cx + dx] = 0;
  }
  stars = [];
  for (let i = 0; i < 25; i++) {
    const sx = 6 + Math.floor(Math.random() * (W - 8));
    const underground = Math.random() < 0.35;       // חלק מהכוכבים מסתתרים באדמה
    const sy = underground ? surfaceY(sx) + 3 + Math.floor(Math.random() * 6) : surfaceY(sx) - 2 - Math.floor(Math.random() * 5);
    if (underground) world[sy][sx] = 0;              // פינוי מקום לכוכב
    stars.push({ x: sx * T + T / 2, y: sy * T + T / 2, got: false });
  }
  snakes = [];
  for (let i = 0; i < 10; i++) {
    const sx = 12 + Math.floor(Math.random() * (W - 14));
    snakes.push({ x: sx * T, y: (surfaceY(sx) - 1) * T, w: 28, h: 14, vx: Math.random() < 0.5 ? 1 : -1, alive: true });
  }
  player = { x: 3 * T, y: (surfaceY(3) - 2) * T, w: 22, h: 28, vx: 0, vy: 0, onGround: false, hurt: 0 };
  camX = 0; hearts = 3; blocks = 0; collected = 0; state = 'play';
  mouse = { x: 0, y: 0 };
  updateBar();
}

// ---------- עזרים ----------
function solid(tx, ty) {
  if (tx < 0 || tx >= W) return true;     // קירות בקצוות העולם
  if (ty < 0) return false;
  if (ty >= H) return false;
  return world[ty][tx] !== 0;
}

function hitsWorld(r) {
  for (let ty = Math.floor(r.y / T); ty <= Math.floor((r.y + r.h - 0.01) / T); ty++)
    for (let tx = Math.floor(r.x / T); tx <= Math.floor((r.x + r.w - 0.01) / T); tx++)
      if (solid(tx, ty)) return true;
  return false;
}

// תזוזה בציר אחד בכל פעם, כדי שאפשר יהיה להתנגש בקירות ובקרקע
function moveX(o, dx) { o.x += dx; if (hitsWorld(o)) { o.x -= dx; return true; } return false; }
function moveY(o, dy) {
  o.y += dy;
  if (hitsWorld(o)) {
    o.y -= dy;
    // צמצום עד למגע מדויק
    const step = Math.sign(dy) * 0.5;
    while (!hitsWorld({ x: o.x, y: o.y + step, w: o.w, h: o.h })) o.y += step;
    return true;
  }
  return false;
}

function updateBar() {
  document.getElementById('hearts').textContent = '❤'.repeat(Math.max(hearts, 0)) || '💔';
  document.getElementById('stars').textContent = collected;
  document.getElementById('total').textContent = stars.length;
  document.getElementById('blocks').textContent = blocks;
}

function loseHeart() {
  if (player.hurt > 0) return;
  hearts--; player.hurt = 90;
  updateBar();
  if (hearts <= 0) state = 'lost';
}

// ---------- עדכון המשחק (רץ 60 פעמים בשנייה) ----------
function update() {
  if (state !== 'play') return;
  const p = player;
  const left = keys.ArrowLeft || keys.a, right = keys.ArrowRight || keys.d;
  const jump = keys[' '] || keys.ArrowUp || keys.w;

  p.vx = (right ? 3.2 : 0) - (left ? 3.2 : 0);
  if (jump && p.onGround) { p.vy = -10.5; p.onGround = false; }
  p.vy = Math.min(p.vy + 0.5, 14);               // כוח המשיכה

  moveX(p, p.vx);
  p.onGround = false;
  if (moveY(p, p.vy)) { if (p.vy > 0) p.onGround = true; p.vy = 0; }
  if (p.y > H * T + 200) { loseHeart(); p.x = 3 * T; p.y = (surfaceY(3) - 2) * T; p.vy = 0; }
  if (p.hurt > 0) p.hurt--;

  // נחשים
  for (const s of snakes) {
    if (!s.alive) continue;
    const ahead = { x: s.x + s.vx * 1, y: s.y, w: s.w, h: s.h };
    const footX = Math.floor((s.vx > 0 ? s.x + s.w + 2 : s.x - 2) / T);
    const footY = Math.floor((s.y + s.h + 2) / T);
    if (hitsWorld(ahead) || !solid(footX, footY)) s.vx *= -1; else s.x += s.vx;
    // התנגשות עם השחקן
    if (p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y) {
      if (p.vy > 1 && p.y + p.h - s.y < 16) { s.alive = false; p.vy = -8; }   // קפיצה מלמעלה
      else loseHeart();
    }
  }

  // איסוף כוכבים
  for (const st of stars) {
    if (!st.got && Math.hypot(st.x - (p.x + p.w / 2), st.y - (p.y + p.h / 2)) < 22) {
      st.got = true; collected++; updateBar();
    }
  }
  if (collected === stars.length) state = 'won';

  // המצלמה עוקבת אחרי השחקן
  camX = Math.max(0, Math.min(W * T - canvas.width, p.x - canvas.width / 2));
  camY = Math.max(0, Math.min(H * T - canvas.height, p.y - canvas.height / 2));
}

// ---------- ציור ----------
function drawStar(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = '#ffd93b'; ctx.fill(); ctx.strokeStyle = '#c99a00'; ctx.stroke();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#d6f0ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff176'; ctx.beginPath(); ctx.arc(800, 80, 40, 0, 7); ctx.fill();   // שמש

  ctx.save(); ctx.translate(-Math.floor(camX), -Math.floor(camY));

  // קוביות (מציירים רק את מה שנראה על המסך)
  const x0 = Math.floor(camX / T), x1 = x0 + Math.ceil(canvas.width / T) + 1;
  for (let y = 0; y < H; y++) for (let x = x0; x <= Math.min(x1, W - 1); x++) {
    const t = world[y][x]; if (!t) continue;
    ctx.fillStyle = COLORS[t]; ctx.fillRect(x * T, y * T, T, T);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.strokeRect(x * T + 0.5, y * T + 0.5, T - 1, T - 1);
  }

  for (const st of stars) if (!st.got) drawStar(st.x, st.y, 11);

  for (const s of snakes) if (s.alive) {
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#a5d6a7'; ctx.fillRect(s.x + 4, s.y + 4, s.w - 8, 4);
    const ex = s.vx > 0 ? s.x + s.w - 7 : s.x + 3;                 // עיניים
    ctx.fillStyle = '#fff'; ctx.fillRect(ex, s.y + 2, 4, 4);
    ctx.fillStyle = '#d32f2f'; ctx.fillRect(s.vx > 0 ? s.x + s.w : s.x - 4, s.y + 6, 4, 2);   // לשון
  }

  const p = player;
  if (!(p.hurt > 0 && Math.floor(p.hurt / 6) % 2)) {               // הבהוב אחרי פגיעה
    ctx.fillStyle = '#ffcc99'; ctx.fillRect(p.x + 3, p.y, 16, 12);  // ראש
    ctx.fillStyle = '#3f51b5'; ctx.fillRect(p.x, p.y + 12, p.w, 10);// גוף
    ctx.fillStyle = '#333'; ctx.fillRect(p.x + 3, p.y + 22, 7, 6); ctx.fillRect(p.x + 12, p.y + 22, 7, 6);
    ctx.fillStyle = '#000'; ctx.fillRect(p.x + 6, p.y + 4, 3, 3); ctx.fillRect(p.x + 13, p.y + 4, 3, 3);
  }

  // מסגרת סביב הקובייה שהעכבר מצביע עליה
  const tx = Math.floor((mouse.x + camX) / T), ty = Math.floor((mouse.y + camY) / T);
  const near = Math.hypot(tx * T + T / 2 - (p.x + p.w / 2), ty * T + T / 2 - (p.y + p.h / 2)) <= REACH;
  ctx.strokeStyle = near ? '#fff' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
  ctx.strokeRect(tx * T, ty * T, T, T); ctx.lineWidth = 1;
  ctx.restore();

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
    ctx.fillText(state === 'won' ? 'ניצחת! אספת את כל הכוכבים 🎉' : 'הפסדת... נסו שוב', canvas.width / 2, 250);
    ctx.font = '22px Arial'; ctx.fillText('לחצו על "משחק חדש"', canvas.width / 2, 300);
  }
}

// ---------- חפירה ובנייה ----------
function clickWorld(e) {
  if (state !== 'play') return;
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * canvas.width / r.width;
  mouse.y = (e.clientY - r.top) * canvas.height / r.height;
  const tx = Math.floor((mouse.x + camX) / T), ty = Math.floor((mouse.y + camY) / T);
  if (tx < 0 || tx >= W || ty < 0 || ty >= H) return;
  const p = player;
  if (Math.hypot(tx * T + T / 2 - (p.x + p.w / 2), ty * T + T / 2 - (p.y + p.h / 2)) > REACH) return;
  if (world[ty][tx]) { world[ty][tx] = 0; blocks++; }              // חפירה
  else if (blocks > 0) {                                           // בנייה (לא בתוך השחקן)
    world[ty][tx] = 4;
    if (hitsWorld(p)) world[ty][tx] = 0; else blocks--;
  }
  updateBar();
}

// ---------- חיבור למקלדת ולעכבר ----------
canvas.addEventListener('mousedown', clickWorld);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * canvas.width / r.width;
  mouse.y = (e.clientY - r.top) * canvas.height / r.height;
});
addEventListener('keydown', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
document.getElementById('restart').addEventListener('click', e => { newGame(); e.target.blur(); });

function loop() { update(); draw(); requestAnimationFrame(loop); }
newGame();
loop();
</script>
</body>
</html>
