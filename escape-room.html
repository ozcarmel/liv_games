<style>
:root{--ink:#1d1b4b;--sun:#ffd23f;--pink:#ff5fa2;--grape:#7a5cff;--mint:#2fd1a0;--night:#2b2160}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,Arial,sans-serif;color:var(--ink);background:var(--night);
  background-image:radial-gradient(rgba(255,255,255,.09) 2px,transparent 3px);background-size:26px 26px;min-height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--grape);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.25)}
header h1{font-family:"Secular One","Arial Rounded MT Bold",Arial,sans-serif;font-size:22px;margin:0;flex:1;white-space:nowrap}
header a,header button{color:#fff;text-decoration:none;font:inherit;font-size:15px;background:rgba(255,255,255,.2);border:0;padding:5px 11px;border-radius:14px;cursor:pointer}
header button[hidden]{display:none}
.stat{background:#fff;color:var(--ink);border-radius:16px;padding:4px 12px;font-weight:700;font-size:17px;white-space:nowrap}
main{max-width:920px;margin:0 auto;padding:14px 16px 40px}
h2{font-family:"Secular One",Arial,sans-serif;color:#fff;text-align:center;font-size:30px;margin:8px 0 4px}
.lead{color:#e6e0ff;text-align:center;font-size:17px;margin:0 0 18px;line-height:1.5}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.room{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 #120d33;padding:14px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:transform .15s}
.room:hover:not([disabled]){transform:translateY(-3px) rotate(-1deg)}
.room[disabled]{opacity:.55;cursor:not-allowed}
.room .em{font-size:54px;line-height:1.1}
.room b{display:block;font-size:20px;margin:6px 0 2px}
.room .lvl{display:inline-block;font-size:14px;border-radius:10px;padding:1px 9px;color:#fff;margin:2px 0 6px}
.room .st{font-size:22px;letter-spacing:2px}
#scene svg{width:100%;height:auto;display:block;border:5px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 7px 0 #120d33;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hot{cursor:pointer}
.hot:hover{filter:brightness(1.12) drop-shadow(0 0 5px #fff)}
.shake{animation:shake .45s}
svg .shake,svg .wig{transform-box:fill-box;transform-origin:center}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.wig{animation:wig .5s}
@keyframes wig{30%{transform:rotate(-8deg) scale(1.05)}70%{transform:rotate(8deg) scale(1.05)}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-6px)}}
#talk{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 12px;margin-top:14px}
#talk svg{flex:none;width:54px;height:54px}
#say{flex:1;font-size:17px;line-height:1.45;min-height:2.9em;display:flex;align-items:center}
#say.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.04)}}
#invWrap{margin-top:12px;background:rgba(255,255,255,.12);border-radius:18px;padding:8px 12px}
#invWrap p{color:#fff;margin:0 0 6px;font-size:15px}
#inv{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:62px;height:62px;border:3px dashed rgba(255,255,255,.45);border-radius:14px;background:rgba(255,255,255,.08);padding:2px;font:inherit}
.slot.full{border:3px solid var(--ink);background:#fff;cursor:pointer}
.slot svg{width:100%;height:100%}
.slot.new{animation:newi .8s}
@keyframes newi{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ov{position:fixed;inset:0;background:rgba(20,14,50,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.box{background:#fff;border:5px solid var(--ink);border-radius:24px;max-width:470px;width:100%;padding:20px 16px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.35);position:relative;max-height:92vh;overflow:auto;animation:pop .3s}
.box h3{font-family:"Secular One",Arial,sans-serif;font-size:24px;margin:0 0 6px}
.box p{font-size:17px;line-height:1.5;margin:6px 0}
.x{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#ffe0ec;font-size:20px;cursor:pointer;line-height:1}
.btn{font:inherit;font-weight:700;font-size:18px;background:var(--mint);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink);margin:4px}
.btn.alt{background:var(--grape)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;justify-content:center;gap:12px;margin:14px 0;flex-wrap:wrap}
.cslot{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;padding:0}
.dot{width:54px;height:54px;border-radius:50%;border:4px solid var(--ink);display:inline-block}
.digit{display:flex;flex-direction:column;align-items:center;gap:5px}
.digit .v{width:62px;height:72px;border:5px solid var(--ink);border-radius:14px;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff}
.digit button{width:48px;height:34px;border:3px solid var(--ink);border-radius:10px;background:#fff3b0;font-size:18px;cursor:pointer;font-weight:700;color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin:14px 0}
.cell{width:72px;height:72px;border:4px solid var(--ink);border-radius:14px;background:#2b2160;font-size:38px;cursor:pointer;padding:0;color:#ffd23f}
.cell.on{background:#ffeaa0}
.pick{width:78px;height:78px;border:4px solid var(--ink);border-radius:16px;background:#f4f2ff;cursor:pointer;padding:4px}
.pick.sel{background:#fff3b0;outline:4px solid var(--pink)}
.pick svg{width:100%;height:100%}
.bad{animation:shake .45s}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.stars .off{filter:grayscale(1);opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.small{font-size:14px;color:#6a6690}
@media (max-width:520px){header h1{font-size:19px}#say{font-size:15px}.slot{width:54px;height:54px}.grid3{grid-template-columns:repeat(3,64px)}.cell{width:64px;height:64px}}
</style>
</head>

<script>
(function () {

function shapeSVG(t, x, y, r, fill, extra) {

  function poly(p) { return '<polygon points="' + p.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ") + '" ' + st + "/>"; }
  var p = [], i, a;

}
function keyIcon(c) { return '<g stroke="' + INK + '" stroke-width="3.5" stroke-linejoin="round"><circle cx="17" cy="30" r="11" fill="' + c + '"/><circle cx="17" cy="30" r="4" fill="#fff"/><path d="M27 26.5h26v7h-5v7h-5v-7h-4v5h-5v-5h-7z" fill="' + c + '"/></g>'; }

var wandIcon = '<g stroke="' + INK + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 50L38 24" stroke-width="8"/><path d="M12 50L38 24" stroke="#5a3e8c" stroke-width="3"/>' + shapeSVG("star", 43, 18, 13, C.yellow) + "</g>";

function apple(x, y) { return '<g stroke="' + INK + '" stroke-width="3"><path d="M' + x + " " + (y - 10) + "q2 -8 8 -9" + '" fill="none"/><circle cx="' + x + '" cy="' + (y + 2) + '" r="12" fill="' + C.red + '"/><circle cx="' + (x - 4) + '" cy="' + (y - 2) + '" r="3" fill="#fff" stroke="none" opacity=".7"/></g>'; }

var modalClose = null;

function colorLock(title, palette, answer, onOk) {

    var f = S.f, d = S.d, R = this;
    if (!f.book) return "התחילו מספר הקסמים הוורוד ליד כדור הבדולח 📖";
    if (!f.simon) return "לחצו על כדור הבדולח, זכרו את הצבעים, ואז לחצו על הנרות באותו סדר.";
    if (!f.wand) return "התיבה שליד הנרות נפתחה! לחצו עליה.";
    if (!f.potion) return "במגילה צריך שיקוי " + CHE[d.target] + ". " + CHE[d.target] + " = " + CHE[R.mix[d.target][0]] + " + " + CHE[R.mix[d.target][1]] + " 🧪";
    return "יש לך שרביט ומפתח כוכב! הציור הקסום מראה איפה להדליק כוכבים בדלת.";
  }
}
];

// ===== מצב המשחק =====
var S = null, R = null;
var SAVE = "livEscapeRoom";
function load() { try { var v = JSON.parse(localStorage.getItem(SAVE)); if (v && v.stars) return v; } catch (e) {} return { stars: [0, 0, 0, 0] }; }
function save(p) { try { localStorage.setItem(SAVE, JSON.stringify(p)); } catch (e) {} }
var prog = load();

function itemDef(id) {
  if (id === "key") return { name: "מפתח קטן", icon: keyIcon("#ffd23f") };
  if (id === "note1") return { name: "פתק", icon: noteIcon, use: function () { ROOMS[0].note(S); } };
  if (id === "cupkey") return { name: "מפתח ירוק", icon: keyIcon("#34c759") };
  if (id === "wand") return { name: "שרביט קסמים", icon: wandIcon };
  if (id === "starkey") return { name: "מפתח כוכב", icon: starKeyIcon };
  if (id.indexOf("shape-") === 0) { var t = id.slice(6); return { name: SHE[t], icon: shapeSVG(t, 30, 30, 20, S.d.pc[t]) }; }
  return { name: id, icon: "" };
}
function give(id) { S.inv.push(id); S.newItem = id; sfx.find(); }
function take(id) { var i = S.inv.indexOf(id); if (i >= 0) S.inv.splice(i, 1); }
function say(t) { var el = $("#say"); el.textContent = t; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.getBoundingClientRect(); el.classList.add("shake"); }
function wiggle(el) { if (!el) return; var g = el.firstElementChild || el; g.classList.remove("wig"); void g.getBoundingClientRect(); g.classList.add("wig"); }

function render() {
  if (!S) return;
  $("#scene").innerHTML = '<svg viewBox="0 0 800 500" role="img" aria-label="' + R.name + '">' + R.draw(S) + "</svg>";
  var inv = $("#inv"), html = "";
  for (var i = 0; i < Math.max(5, S.inv.length); i++) {
    var id = S.inv[i];
    if (id) { var def = itemDef(id); html += '<button class="slot full' + (id === S.newItem ? " new" : "") + '" data-i="' + id + '" title="' + def.name + '" aria-label="' + def.name + '"><svg viewBox="0 0 60 60">' + def.icon + "</svg></button>"; }
    else html += '<span class="slot"></span>';
  }
  inv.innerHTML = html;
  S.newItem = null;
}
$("#scene").addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-h]") : null;
  if (!el || !S || S.done) return;
  R.click(el.dataset.h, S, el);
});
$("#inv").addEventListener("click", function (e) {
  var b = e.target.closest("[data-i]"); if (!b || !S) return;
  var def = itemDef(b.dataset.i);
  if (def.use) def.use(); else say("זה " + def.name + ". איפה אפשר להשתמש בו? 🤔");
});

function startRoom(i) {
  R = ROOMS[i];
  S = { i: i, f: {}, inv: [], hints: 0, d: R.setup(), busy: false, done: false };
  $("#menu").hidden = true; $("#game").hidden = false;
  $("#hintBtn").hidden = false; $("#menuBtn").hidden = false;
  render(); say(R.intro);
  window.scrollTo(0, 0);
}
function showMenu() {
  S = null; R = null;
  $("#menu").hidden = false; $("#game").hidden = true;
  $("#hintBtn").hidden = true; $("#menuBtn").hidden = true;
  var total = prog.stars.reduce(function (a, b) { return a + b; }, 0);
  $("#sStars").textContent = "⭐ " + total;
  $("#rooms").innerHTML = ROOMS.map(function (r, i) {
    var open = i === 0 || prog.stars[i - 1] > 0, st = prog.stars[i];
    return '<button class="room" data-r="' + i + '"' + (open ? "" : " disabled") + '><div class="em">' + (open ? r.em : "🔒") + "</div><b>" + (i + 1) + ". " + r.name + '</b><span class="lvl" style="background:' + r.lc + '">' + r.lvl + '</span><div class="st">' + (st ? "⭐⭐⭐".slice(0, st * 2) + '<span style="opacity:.25">' + "⭐⭐⭐".slice(0, (3 - st) * 2) + "</span>" : (open ? "שחקו!" : "פתרו את החדר הקודם")) + "</div></button>";
  }).join("");
  [].forEach.call(document.querySelectorAll(".room"), function (b) { b.onclick = function () { if (!b.disabled) { sfx.click(); startRoom(+b.dataset.r); } }; });
}
$("#menuBtn").onclick = function () { closeModal(); $("#win").classList.remove("on"); showMenu(); };
$("#hintBtn").onclick = function () { if (!S || S.done) return; S.hints++; tone(880, 0.15, "sine"); say("💡 " + R.hint(S)); };

function confetti() {
  var box = $("#confetti"), cols = ["#ff4d5e", "#ffd23f", "#34c759", "#3d8bff", "#9b5cff", "#ff7ac0"];
  for (var i = 0; i < 70; i++) {
    var c = document.createElement("i");
    c.style.left = Math.random() * 100 + "vw"; c.style.background = pick(cols);
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + "s"; c.style.animationDelay = Math.random() * 0.6 + "s";
    box.appendChild(c);
  }
  setTimeout(function () { box.innerHTML = ""; }, 4500);
}
function winRoom() {
  S.f.open = 1; S.done = true; render(); sfx.win();
  say("הדלת נפתחה! 🎉");
  var st = S.hints === 0 ? 3 : S.hints <= 2 ? 2 : 1, i = S.i;
  if (st > prog.stars[i]) { prog.stars[i] = st; save(prog); }
  $("#sStars").textContent = "⭐ " + prog.stars.reduce(function (a, b) { return a + b; }, 0);
  var last = i === ROOMS.length - 1;
  setTimeout(function () {
    confetti();
    var stars = "";
    for (var k = 0; k < 3; k++) stars += '<span class="' + (k < st ? "" : "off") + '">⭐</span>';
    $("#wbox").innerHTML = "<h3>" + (last ? "🏆 ברחת מכל החדרים!" : "🎉 ברחת מ" + R.name + "!") + '</h3><div class="stars">' + stars + "</div><p>" +
      (S.hints === 0 ? "בלי אף רמז! את/ה גאון/ית של חידות 🧠" : "השתמשת ב־" + S.hints + " רמזים. נסו שוב בלי רמזים כדי לקבל 3 כוכבים!") + "</p>" +
      (last ? "<p>פתרת את כל ארבעת החדרים. כל הכבוד! 🌟</p>" : "") +
      '<div class="row">' + (last ? "" : '<button class="btn" id="wNext">לחדר הבא ←</button>') + '<button class="btn alt" id="wAgain">🔄 שוב</button><button class="btn alt" id="wMenu">🚪 כל החדרים</button></div><p class="small">בכל פעם הרמזים והקודים מתחלפים!</p>';
    $("#win").classList.add("on");
    if (!last) $("#wNext").onclick = function () { $("#win").classList.remove("on"); startRoom(i + 1); };
    $("#wAgain").onclick = function () { $("#win").classList.remove("on"); startRoom(i); };
    $("#wMenu").onclick = function () { $("#win").classList.remove("on"); showMenu(); };
  }, 1100);
}

window.escapeRoomState = function () { return S; }; // לבדיקות
showMenu();
})();
</script>
</body>
</html>
