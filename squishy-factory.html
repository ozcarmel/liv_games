  :root {

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 {

  .modes { display: flex; gap: 8px; flex-wrap: wrap; }
  .modes button, .btn {
    font-family: var(--display); font-size: 1.05rem; color: var(--ink);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .1s;
  }
  .modes button:hover, .btn:hover { transform: translateY(-2px); }
  .modes button:active, .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--sun); }
  .modes button.pop[aria-pressed="true"] { background: var(--pink); color: #fff; }
  button:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }

  .stage {

    </div>
  </header>

    <canvas id="cv" aria-label="סקוויש גדול על הלוח. לוחצים עליו כדי לסחוט"></canvas>
    <div class="hud">
      <div class="chip" id="chipPops" hidden>פיצוצים<b id="popCount">0</b></div>
      <div class="chip" id="chipCombo" hidden>רצף<b id="comboCount">x1</b></div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="hint" id="hint"></div>
    <button class="mute" id="mute" type="button" aria-label="השתקת צליל" title="צליל">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="muteIcon"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </div>

  <section class="workshop" id="workshop" aria-labelledby="wsTitle">
    <h2 id="wsTitle">הסדנה</h2>
    <p class="sub">בחרו צורה, צבע, פרצוף וקישוט. הסקוויש משתנה מיד, ואפשר ללחוץ עליו ולסחוט אותו.</p>
    <div class="group"><h3>צורה</h3><div class="opts" id="optShape"></div></div>
    <div class="group"><h3>צבע</h3><div class="opts" id="optColor"></div></div>
    <div class="group"><h3>פרצוף</h3><div class="opts" id="optFace"></div></div>
    <div class="group"><h3>קישוט</h3><div class="opts" id="optAcc"></div></div>
    <div class="row-btns">
      <button type="button" class="btn alt" id="randomBtn">הפתעה</button>
      <button type="button" class="btn" id="squeezeBtn">סוחטים</button>
      <button type="button" class="btn go" id="popBtn">מפוצצים!</button>
    </div>
  </section>

  <p class="foot">המשחק של ליב · <a href="index.html">חזרה לאתר המשחקים</a></p>
</main>

<script>
(function () {
  "use strict";

  // =====================================================================
  //  1. כלים וצלילים
  // =====================================================================
  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  var INK = "#1d1b4b";

  var AC = null, muted = false, noiseBuf = null, squishNode = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (AC && AC.state === "suspended") AC.resume();
    if (AC && !noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return AC;
  }
  function tone(f, dur, type, vol, slide, delay) {
    if (muted || !ac()) return;
    var t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol || .2, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(dur, vol, freq, kind, delay) {
    if (muted || !ac()) return;
    var t0 = AC.currentTime + (delay || 0), s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = kind || "bandpass"; f.frequency.value = freq || 1000;
    var g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t0, Math.random()); s.stop(t0 + dur + .05);
  }
  var sfx = {
    press: function () { noise(.12, .22, 700, "lowpass"); tone(320, .14, "sine", .25, 120); },
    release: function () { tone(170, .45, "sine", .3, 330); tone(240, .35, "triangle", .12, 420, .03); },
    pop: function () { noise(.35, .5, 1800, "highpass"); tone(900, .22, "square", .15, 160); tone(110, .3, "sine", .5, 40); },
    cheer: function () { tone(660, .12, "triangle", .15, null, 0); tone(880, .12, "triangle", .15, null, .09); tone(1320, .2, "triangle", .15, null, .18); },
    pick: function () { tone(740, .07, "triangle", .12, 990); },
    respawn: function () { tone(260, .3, "sine", .2, 620); },
    holdStart: function () {
      if (muted || !ac()) return; sfx.holdStop();
      var s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 500; f.Q.value = 2;
      var g = AC.createGain(); g.gain.value = .035;

    holdSet: function (p, depth) { if (squishNode) { squishNode.f.frequency.value = 350 + p * 1500 + depth * 300; squishNode.g.gain.value = .03 + p * .06; } },
    holdStop: function () { if (squishNode) { try { squishNode.s.stop(); } catch (e) {} squishNode = null; } }

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // =====================================================================
  //  2. עיצוב הסקוויש: אפשרויות
  // =====================================================================
  var SHAPES = [
    { id: "mochi", name: "מוצ׳י" }, { id: "cat", name: "חתול" }, { id: "heart", name: "לב" },
    { id: "star", name: "כוכב" }, { id: "flower", name: "פרח" }, { id: "donut", name: "דונאט" }
  ];
  var COLORS = ["#ff8fc7", "#ffb072", "#ffe066", "#b8f26a", "#5de0b6", "#6fd3ff", "#b9a2ff", "#8a6bff", "#ffffff", "#ff6b6b"];
  var COLOR_NAMES = ["ורוד", "כתום", "צהוב", "ירוק", "טורקיז", "תכלת", "סגול בהיר", "סגול", "לבן", "אדום"];
  var FACES = ["שמח", "מתוק", "מנומנם", "מופתע", "שובב", "מגניב"];
  var ACCS = ["בלי", "סומק", "פפיון", "משקפיים", "סוכריות", "כתר"];
  var SPRINK = ["#ff5fa2", "#ffd23f", "#2fd1a0", "#6fd3ff", "#7a5cff", "#ffffff"];

  var design = { shape: "mochi", color: 0, face: 0, acc: 1 };
  try {
    var saved = JSON.parse(localStorage.getItem("squishyDesign") || "null");
    if (saved && SHAPES.some(function (s) { return s.id === saved.shape; })) design = saved;
  } catch (e) {}
  function saveDesign() { try { localStorage.setItem("squishyDesign", JSON.stringify(design)); } catch (e) {} }

  // ----- קווי המתאר של הצורות -----
  var N = 88, outlines = {};
  function bump(th, c) { var d = th - c; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return Math.exp(-Math.pow(d / .2, 2)); }
  function outline(id) {
    if (outlines[id]) return outlines[id];
    var b = [], i;
    for (i = 0; i < N; i++) {
      var th = i / N * Math.PI * 2 - Math.PI / 2, a = th + Math.PI / 2, x, y, r;
      if (id === "mochi") { x = Math.cos(th) * 1.1; y = Math.sin(th) * .88; }
      else if (id === "cat") { r = .9 + .42 * bump(th, -Math.PI / 2 - .62) + .42 * bump(th, -Math.PI / 2 + .62); x = Math.cos(th) * r * 1.08; y = Math.sin(th) * r * .94 + .06; }
      else if (id === "heart") { var t = i / N * Math.PI * 2; x = 16 * Math.pow(Math.sin(t), 3) / 17; y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17; }
      else if (id === "star") { r = .74 + .27 * Math.cos(5 * a); x = Math.cos(th) * r; y = Math.sin(th) * r; }
      else if (id === "flower") { r = .72 + .3 * Math.abs(Math.cos(3 * a)); x = Math.cos(th) * r; y = Math.sin(th) * r; }
      else { x = Math.cos(th); y = Math.sin(th); }
      b.push({ x: x, y: y });
    }
    var mx = 0, my = 0, ar = 0;
    b.forEach(function (p) { mx += p.x; my += p.y; }); mx /= N; my /= N;
    b.forEach(function (p) { p.x -= mx; p.y -= my; ar += Math.hypot(p.x, p.y); }); ar /= N;
    var minx = 9, maxx = -9, miny = 9, maxy = -9;
    b.forEach(function (p) { p.x /= ar; p.y /= ar; minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); });
    var u = b.map(function (p) { var l = Math.hypot(p.x, p.y) || 1; return { x: p.x / l, y: p.y / l }; });
    return (outlines[id] = { b: b, u: u, w: maxx - minx, h: maxy - miny, top: miny, bottom: maxy });
  }
  var FACE_OFF = { mochi: .02, cat: .12, heart: -.06, star: .08, flower: .02, donut: 0 };

  var SPR = [];
  (function () { var s = 7; function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < 18; i++) SPR.push({ a: r() * Math.PI * 2 - Math.PI / 2, rf: .56 + r() * .3, rot: r() * Math.PI, c: SPRINK[Math.floor(r() * SPRINK.length)] }); })();

  //  3. ציור סקוויש (גם למשחק וגם לתמונות הקטנות בסדנה)
  // =====================================================================
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    return "rgb(" + clamp((n >> 16) + amt, 0, 255) + "," + clamp(((n >> 8) & 255) + amt, 0, 255) + "," + clamp((n & 255) + amt, 0, 255) + ")";
  }
  function mix(hex, hex2, t) {
    var a = parseInt(hex.slice(1), 16), b = parseInt(hex2.slice(1), 16);
    var r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));

  }
  function smoothPath(g, q) {
    var n = q.length;
    g.moveTo((q[0].x + q[n - 1].x) / 2, (q[0].y + q[n - 1].y) / 2);

  function drawSquishy(g, d, cx, cy, S, scx, scy, o, st) {
    var ob = outline(d.shape), B = ob.b, U = ob.u, n = B.length, i, sf = S / 155;
    var q = [], minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (i = 0; i < n; i++) {

  // =====================================================================
  var HINTS = {
    make: "בחרו למטה צורה, צבע, פרצוף וקישוט. אפשר גם ללחוץ על הסקוויש ולסחוט אותו!",
    squeeze: "לחצו על הסקוויש והחזיקו כדי לסחוט אותו. שחררו וראו איך הוא קופץ חזרה",
    pop: "החזיקו לחוץ והטבעת תתמלא. כשהיא מלאה, הסקוויש מתפוצץ!"
  };
  function setMode(m) {
    mode = m; pressure = 0; press.on = false; sfx.holdStop();
    document.querySelectorAll(".modes button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.mode === m ? "true" : "false"); });
    $("workshop").hidden = m !== "make";
    $("chipPops").hidden = $("chipCombo").hidden = m !== "pop";
    $("hint").textContent = HINTS[m];
    $("live").textContent = m === "make" ? "מצב הכנה" : m === "squeeze" ? "מצב סחיטה" : "מצב פיצוץ";
  }
  document.querySelectorAll(".modes button").forEach(function (b) { b.addEventListener("click", function () { ac(); setMode(b.dataset.mode); }); });
  $("squeezeBtn").addEventListener("click", function () { ac(); setMode("squeeze"); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("popBtn").addEventListener("click", function () { ac(); setMode("pop"); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("randomBtn").addEventListener("click", function () {
    ac(); sfx.pick();
    design = { shape: SHAPES[Math.floor(Math.random() * SHAPES.length)].id, color: Math.floor(Math.random() * COLORS.length),
               face: Math.floor(Math.random() * FACES.length), acc: Math.floor(Math.random() * ACCS.length) };
    changed(true);
  });
  $("mute").addEventListener("click", function () {
    muted = !muted; if (muted) sfx.holdStop();
    $("muteIcon").innerHTML = muted
      ? '<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/>'
      : '<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>';
    $("mute").setAttribute("aria-label", muted ? "הפעלת צליל" : "השתקת צליל");
  });

  // ----- כפתורי הבחירה, עם תמונות קטנות שמצוירות בעצמן -----
  var optButtons = { shape: [], color: [], face: [], acc: [] };
  function thumb(d, forShape) {
    var c = document.createElement("canvas"); c.width = c.height = 108;
    var t = c.getContext("2d"), z = new Float32Array(N);
    drawSquishy(t, d, 54, forShape ? 56 : 58, forShape ? 30 : 36, 1, 1, z, { pressure: 0, squeezed: false });
    return c;
  }
  function build(group, items, getDesign, onPick, kind) {
    var box = $("opt" + kind);
    items.forEach(function (it, i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "opt" + (group === "color" ? " sw" : "");
      b.setAttribute("aria-label", it.label); b.title = it.label;
      if (group === "color") { b.style.background = it.color; b.style.borderColor = INK; }
      else b.appendChild(thumb(getDesign(i), group === "shape"));
      b.addEventListener("click", function () { ac(); sfx.pick(); onPick(i); });
      optButtons[group].push(b); box.appendChild(b);
    });
  }
  function refreshButtons() {
    var shapeIdx = SHAPES.findIndex(function (s) { return s.id === design.shape; });
    optButtons.shape.forEach(function (b, i) { b.setAttribute("aria-pressed", i === shapeIdx ? "true" : "false"); });
    optButtons.color.forEach(function (b, i) { b.setAttribute("aria-pressed", i === design.color ? "true" : "false"); });
    optButtons.face.forEach(function (b, i) { b.setAttribute("aria-pressed", i === design.face ? "true" : "false"); });
    optButtons.acc.forEach(function (b, i) { b.setAttribute("aria-pressed", i === design.acc ? "true" : "false"); });
  }
  // התמונות הקטנות של הפרצוף והקישוט משתמשות בצבע ובצורה הנוכחיים, לכן מציירים אותן מחדש בכל שינוי
  function rebuildThumbs() {
    [["face", FACES, function (i) { return { shape: design.shape, color: design.color, face: i, acc: 0 }; }],
     ["acc", ACCS, function (i) { return { shape: design.shape, color: design.color, face: design.face, acc: i }; }],
     ["shape", SHAPES, function (i) { return { shape: SHAPES[i].id, color: design.color, face: design.face, acc: 0 }; }]
    ].forEach(function (grp) {
      optButtons[grp[0]].forEach(function (b, i) { var c = b.querySelector("canvas"); if (c) b.replaceChild(thumb(grp[2](i), grp[0] === "shape"), c); });
    });
  }
  function changed(fromRandom) {
    saveDesign(); refreshButtons(); rebuildThumbs();
    if (!popped) { spawnT = Math.min(spawnT, .45); }
    if (fromRandom) { o.fill(0); v.fill(0); spawnT = 0; }
    else { // נדנוד חלק של כל הגוף (גל עדין סביב ההיקף, לא רעש)
      var ph = rand(0, 6.28), kk = 2 + Math.floor(rand(0, 2));
      for (var i = 0; i < N; i++) v[i] += 3 * Math.cos(kk * (i / N * 6.283) + ph);
    }
  }
  function initWorkshop() {
    build("shape", SHAPES.map(function (s) { return { label: s.name }; }), function (i) { return { shape: SHAPES[i].id, color: design.color, face: design.face, acc: 0 }; },
      function (i) { design.shape = SHAPES[i].id; changed(false); }, "Shape");
    build("color", COLORS.map(function (c, i) { return { label: COLOR_NAMES[i], color: c }; }), null,
      function (i) { design.color = i; changed(false); }, "Color");
    build("face", FACES.map(function (f) { return { label: f }; }), function (i) { return { shape: design.shape, color: design.color, face: i, acc: 0 }; },
      function (i) { design.face = i; changed(false); }, "Face");
    build("acc", ACCS.map(function (a) { return { label: a }; }), function (i) { return { shape: design.shape, color: design.color, face: design.face, acc: i }; },
      function (i) { design.acc = i; changed(false); }, "Acc");
    refreshButtons();
  }

  // =====================================================================
  //  9. מתחילים
  // =====================================================================
  resize();
  window.addEventListener("resize", function () { var w = W; resize(); if (w !== W) spawnT = Math.min(spawnT, .5); });
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  initWorkshop();
  setMode("make");
  spawnT = 0;
  requestAnimationFrame(render);
  fontsReady.then(rebuildThumbs);
})();
</script>
</body>
</html>
