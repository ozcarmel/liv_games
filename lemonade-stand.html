  <style>
/* style.css = הבגדים של המשחק: צבעים, גופנים ומיקומים */

/* תוכנית העיצוב: דוכן רחוב מצויר ביום קיץ, הרבה צבע ושמש,
   הכסף בקופה הוא הכוכב, וכל השאר שקט סביבו. */
:root {
  --lemon: #ffcf33;
  --lemon-deep: #e8a200;
  --berry: #e5383b;
  --leaf: #2f9e44;
  --wood: #8d5524;
  --ink: #33210f;
  --muted: #7d6a4a;
  --card: #ffffff;
  --line: #f0dfa8;

  --font-display: "Secular One", "Rubik", "Arial Hebrew", sans-serif;
  --font-body: "Rubik", "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: linear-gradient(#a9dcff 0, #fff1b0 420px, #fff1b0 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) 32px max(16px, env(safe-area-inset-right, 0px));
}

/* ----- כותרת וקופה ----- */
.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.8rem, 6vw, 2.6rem);
  margin: 0;
  color: var(--berry);
  text-shadow: 0 2px 0 #fff;
  text-wrap: balance;
}
.cash {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--ink);
  color: #fff;
  padding: 6px 16px 6px 18px;
  border-radius: 999px;
  box-shadow: 0 4px 0 #1a1007;
}
.cash-label { font-size: .85rem; opacity: .75; }
.cash-num {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 1;
  color: var(--lemon);
  font-variant-numeric: tabular-nums;
}
.cash-num small { font-size: 1.1rem; margin-inline-start: 3px; }
.cash.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.12); } }

/* ----- הסצנה ----- */
#scene {
  position: relative;
  aspect-ratio: 600 / 320;
  width: 100%;
  border-radius: 22px;
  overflow: hidden;
  border: 4px solid #fff;
  box-shadow: 0 8px 0 rgba(51, 33, 15, .15), 0 14px 30px rgba(51, 33, 15, .18);
  background: #8cd0ff;
  --sky1: #5fc0ff; --sky2: #def4ff;
  --sun-op: 1; --cloud-op: .55;
  --hill1: #8fd16a; --hill2: #6cbf4a; --crown: #2f9e44;
  --walk: #e2c79a; --walk-edge: #c9a972;
  --inside: #ffe7a8;
  --awn1: #e5383b; --awn2: #ffffff; --sign: #ffd93d; --shirt: #37b24d;
}
#scene.w-hot    { --sky1: #ffa94d; --sky2: #ffecb3; --sun-op: 1; --cloud-op: .25; }
#scene.w-sunny  { --sky1: #5fc0ff; --sky2: #def4ff; --sun-op: 1; --cloud-op: .55; }
#scene.w-cloudy { --sky1: #9db3c6; --sky2: #e1e9f0; --sun-op: 0; --cloud-op: 1; }
#scene.w-rainy  { --sky1: #56677a; --sky2: #99a9b8; --sun-op: 0; --cloud-op: 1; }
/* חורף: שלג וקור מקפיא */
#scene.w-snowy {
  --sky1: #8798ab; --sky2: #e9eff5; --sun-op: 0; --cloud-op: 1;
  --hill1: #f4f8fb; --hill2: #dfe8f0; --crown: #6b8f71;
  --walk: #eef3f7; --walk-edge: #cfdae4;
}
#scene.w-freezing {
  --sky1: #86c5ec; --sky2: #eaf6fd; --sun-op: .75; --cloud-op: .35;
  --hill1: #d6ebe8; --hill2: #bfdcd8; --crown: #5f9a8f;
  --walk: #d9e6ee; --walk-edge: #b9cdda;
}
/* דוכן חורף: תה ועוגיות */
#scene.mode-winter { --awn1: #1c7ed6; --awn2: #ffffff; --sign: #ffe8a3; --inside: #ffd6a0; --shirt: #e8590c; }
#scene.mode-winter.w-rainy { --inside: #ffd6a0; }
.a1 { fill: var(--awn1); }
.a2 { fill: var(--awn2); }
.sign-board { fill: var(--sign); }
.owner-shirt { fill: var(--shirt); }
.crown circle { fill: var(--crown); }
.only-winter, .snow-cap { display: none; }
#scene.mode-winter .only-winter { display: inline; }
#scene.mode-winter .only-summer { display: none; }
#scene.w-snowy .snow-cap { display: inline; }
#scene.w-snowy .fruit, #scene.w-freezing .fruit { display: none; }
.steam { animation: steam 2.4s ease-in-out infinite; }
@keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 50% { opacity: .9; } 100% { transform: translateY(-8px); opacity: 0; } }

#art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sun { opacity: var(--sun-op); transition: opacity .8s; }
#scene.w-hot #sun { transform-origin: 520px 46px; animation: throb 2s ease-in-out infinite alternate; }
@keyframes throb { to { transform: scale(1.15); } }

.cloud { opacity: var(--cloud-op); transition: opacity .8s; animation: drift 60s linear infinite; }
.cl2 { animation-duration: 80s; animation-delay: -30s; }
.cl3 { animation-duration: 70s; animation-delay: -50s; }
@keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(760px); } }

#rain {
  position: absolute; inset: 0; display: none; pointer-events: none;
  background-image: repeating-linear-gradient(103deg, transparent 0 9px, rgba(255,255,255,.55) 9px 10px);
  background-size: 44px 44px;
  animation: fall .45s linear infinite;
}
#scene.w-rainy #rain { display: block; }
@keyframes fall { to { background-position: -12px 44px; } }

/* שלג: שלוש שכבות של פתיתים בגדלים שונים */
#snow {
  position: absolute; inset: 0; display: none; pointer-events: none;
  background-image:
    radial-gradient(circle, #fff 0 2.5px, transparent 3px),
    radial-gradient(circle, #fff 0 1.8px, transparent 2.2px),
    radial-gradient(circle, #ffffffcc 0 1.2px, transparent 1.6px);
  background-size: 90px 90px, 60px 60px, 41px 41px;
  background-position: 10px 0, 30px 20px, 5px 10px;
  animation: snowfall 6s linear infinite;
}
#scene.w-snowy #snow { display: block; }
@keyframes snowfall {
  to { background-position: 0 90px, 20px 80px, -5px 51px; }
}

#weather-chip {
  position: absolute; top: 10px; inset-inline-start: 10px;
  display: flex; gap: 8px; align-items: baseline;
  background: rgba(255, 255, 255, .92);
  border-radius: 999px;
  padding: 4px 12px;
  font-weight: 700;
  font-size: .9rem;
  cursor: pointer;
  z-index: 12;
}
#w-temp { font-family: var(--font-display); color: var(--berry); font-weight: 400; font-size: 1.05rem; }

#toast {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 6px 16px; border-radius: 999px;
  font-weight: 500; font-size: .95rem;
  z-index: 20; white-space: nowrap;
  max-width: 94%; overflow: hidden; text-overflow: ellipsis;
}

/* ----- לקוחות ----- */
#street { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.customer {
  position: absolute;
  width: 8%;
  max-width: 48px;
  min-width: 32px;
  cursor: pointer;
  pointer-events: auto;
  transition: left 1.8s cubic-bezier(.3, .7, .3, 1);
  user-select: none;
}
.customer .sprite { display: block; width: 100%; animation: bob .5s ease-in-out infinite alternate; }
.customer.arrived .sprite { animation: none; }
@keyframes bob { to { transform: translateY(-3px); } }
.customer .bubble {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  margin-bottom: 2px;
  background: #fff; border: 2px solid var(--ink);
  border-radius: 10px;
  padding: 1px 6px 3px;
  font-size: .72rem; font-weight: 700; white-space: nowrap;
  display: flex; align-items: center; gap: 3px;
}
.customer .bubble svg { width: 16px; height: 16px; }
.customer .bar {
  position: absolute; bottom: 100%; left: 12%; right: 12%;
  height: 4px; margin-bottom: -2px;
  background: rgba(0,0,0,.15); border-radius: 2px; overflow: hidden;
}
.customer .bar i { display: block; height: 100%; width: 100%; background: var(--leaf); }
.customer .bubble svg.want { width: 22px; height: 22px; }
.customer.hungry:hover .sprite { filter: drop-shadow(0 0 6px var(--lemon)); transform: scale(1.06); }
.customer.leaving { opacity: 0; transition: opacity .5s, left 1.4s ease-in; }
.customer.happy .sprite { animation: hop .45s ease; }
@keyframes hop { 40% { transform: translateY(-14px); } }

.pop {
  position: absolute; z-index: 15; pointer-events: none;
  font-family: var(--font-display); font-size: 1.5rem; color: #fff;
  -webkit-text-stroke: 2px var(--lemon-deep);
  paint-order: stroke fill;
  animation: rise 1s ease-out forwards;
}
@keyframes rise { to { transform: translateY(-46px); opacity: 0; } }

/* ----- לוחות ----- */
.card {
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px 16px;
  min-width: 0;
}
.card h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.15rem;
  margin: 0 0 10px;
  color: var(--wood);
}

.hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; text-align: center; }

/* ----- רשימת המוצרים ----- */
.products-card { margin-top: 16px; }
.products { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.prod {
  display: grid;
  grid-template-columns: 40px 1fr auto auto;
  align-items: center;
  gap: 4px 12px;
  padding: 10px 12px;
  border-radius: 14px;
  background: #fff8dc;
}
.prod.low { background: #ffe9e6; }
.prod.flash { animation: flashrow .6s 2; }
@keyframes flashrow { 50% { background: #ffb4ad; } }
.prod .ico { width: 40px; height: 40px; }
.prod .name { font-weight: 700; font-size: 1.05rem; }
.prod .count { font-family: var(--font-display); font-size: 1.4rem; min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.prod .count small { display: block; font-family: var(--font-body); font-size: .7rem; color: var(--muted); }
.prod .pricing {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  padding-top: 6px;
  border-top: 2px dashed var(--line);
}
.prod .pricing .label { color: var(--muted); font-size: .9rem; }
.prod .price-val {
  font-family: var(--font-display); font-size: 1.5rem; color: var(--berry);
  min-width: 3.2ch; text-align: center; font-variant-numeric: tabular-nums;
}
.prod .verdict { margin-inline-start: auto; font-size: .85rem; font-weight: 500; }
.prod .verdict.good { color: var(--leaf); }
.prod .verdict.bad { color: var(--berry); }
button.small { width: 34px; height: 34px; border-radius: 50%; padding: 0; font-size: 1.2rem; line-height: 1; }

button {
  font-family: var(--font-body);
  font-size: .95rem;
  font-weight: 700;
  color: var(--ink);
  border: none;
  border-radius: 12px;
  padding: 7px 12px;
  background: var(--lemon);
  box-shadow: 0 3px 0 var(--lemon-deep);
  cursor: pointer;
  white-space: nowrap;
}
button:hover { filter: brightness(1.05); }
button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--lemon-deep); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button:disabled { background: #e9e4d2; box-shadow: none; color: #9a9078; cursor: not-allowed; }
button .cost { font-weight: 500; opacity: .8; margin-inline-start: 4px; }
button.round { width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1; padding: 0; }

.footer-stats { text-align: center; color: var(--muted); font-size: .9rem; margin: 18px 0 0; }
.footer-stats b { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .cloud, #sun, #rain, .customer .sprite { animation: none !important; }
}

</style>
</head>

    <!-- ================= מוצרים ================= -->

      <h2 id="h-prod">מה מוכרים היום</h2>

      <p class="hint">לכל מוצר יש מחיר ומלאי משלו. הלקוחות יודעים להבחין בין הוגן ליקר.</p>
    </section>

    <p class="footer-stats">
      נמכרו בסך הכל <b id="sold">0</b> מוצרים · <b id="missed">0</b> לקוחות הלכו כי היה יקר
    </p>

  <script>
// script.js = המוח של המשחק: כל החוקים והחישובים
// המשחק רציף: אין יעד ואין ימים. כל מוצר שמוכרים מוסיף כסף לקופה.
// בחום ובשמש הדוכן מוכר לימונדה, קרטיבים ופתיבר. בגשם, בשלג ובקור הוא הופך לדוכן תה ועוגיות.

// ---------- 1. המוצרים ----------
// fair = המחיר ההוגן, cost = כמה עולה לקנות חבילה של 5 יחידות
const PRODUCTS = {
  lemonade: { name: "לימונדה", icon: "i-lemonade", fair: 5, cost: 8 },
  popsicle: { name: "קרטיב",   icon: "i-popsicle", fair: 4, cost: 7 },
  petit:    { name: "פתיבר",   icon: "i-petit",    fair: 6, cost: 12 },
  tea:      { name: "תה חם",   icon: "i-tea",      fair: 5, cost: 8 },
  cookie:   { name: "עוגיות",  icon: "i-cookie",   fair: 4, cost: 8 }
};
const BATCH = 5; // כמה יחידות מקבלים בכל קנייה

// שני סוגי דוכן
const STANDS = {
  summer: {
    title: "דוכן הלימונדה",
    sign: "לימונדה · קרטיבים · פתיבר",
    products: ["lemonade", "popsicle", "petit"],
    hello: "יום חם! פותחים דוכן לימונדה, קרטיבים ופתיבר"
  },
  winter: {
    title: "דוכן התה והעוגיות",
    sign: "תה חם ועוגיות",
    products: ["tea", "cookie"],
    hello: "קר בחוץ! הדוכן הופך לדוכן תה חם ועוגיות"
  }
};

// סוגי מזג אוויר:
// crowd = כמה לקוחות מגיעים, bonus = כמה זה מעלה את מה שהלקוחות מוכנים לשלם
const WEATHERS = [
  { cls: "w-hot",      name: "חם מאוד", temp: 34, crowd: 1.0,  bonus: 3,   stand: "summer" },
  { cls: "w-sunny",    name: "שמשי",    temp: 27, crowd: 0.75, bonus: 1.5, stand: "summer" },
  { cls: "w-cloudy",   name: "מעונן",   temp: 21, crowd: 0.5,  bonus: -0.5, stand: "summer" },
  { cls: "w-rainy",    name: "גשום",    temp: 14, crowd: 0.55, bonus: 1.5, stand: "winter" },
  { cls: "w-snowy",    name: "שלג",     temp: -2, crowd: 0.5,  bonus: 2.5, stand: "winter" },
  { cls: "w-freezing", name: "קר מאוד", temp: 3,  crowd: 0.55, bonus: 2,   stand: "winter" }
];

// ---------- 2. מה שהמשחק "זוכר" ----------
const state = {
  money: 20,
  stock: { lemonade: 6, popsicle: 6, petit: 6, tea: 6, cookie: 6 },
  prices: { lemonade: 5, popsicle: 4, petit: 6, tea: 5, cookie: 4 },
  sold: 0,
  missed: 0,
  weather: null,
  festival: false
};

const PATIENCE = 9;          // כמה שניות לקוח מוכן לחכות
const MAX_WAITING = 5;       // כמה לקוחות יכולים לחכות בו זמנית
const WEATHER_EVERY = 45000; // כל כמה זמן מזג האוויר משתנה

// ---------- 3. עזרים ----------
const $ = (id) => document.getElementById(id);
const random = (min, max) => min + Math.random() * (max - min);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const stand = () => STANDS[state.weather.stand];

// שמירה בדפדפן, כדי שהכסף יישאר גם אחרי סגירה. אם אי אפשר לשמור, ממשיכים בלי
const SAVE_KEY = "lemonade-stand-v2";
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      money: state.money, stock: state.stock, prices: state.prices, sold: state.sold
    }));
  } catch (e) { /* בסדר */ }
}
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (data) {
      state.money = data.money;
      state.sold = data.sold;
      Object.assign(state.stock, data.stock);
      Object.assign(state.prices, data.prices);
    }
  } catch (e) { /* בסדר */ }
}

// צלילים קטנים בלי קבצים: הדפדפן "מנגן" צפצוף בתדר שאנחנו קובעים
let audioCtx = null;
function beep(freq, length = 0.12, volume = 0.07) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + length);
  } catch (e) { /* אם אין סאונד, ממשיכים בשקט */ }
}
const coinSound = () => { beep(988, 0.07); setTimeout(() => beep(1319, 0.14), 70); };
const buySound = () => beep(520, 0.06);
const sadSound = () => beep(180, 0.2);

let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

// ---------- 4. מה הלקוחות מוכנים לשלם ----------
// המחיר שלקוח "ממוצע" מוכן לשלם על מוצר, לפי מזג האוויר
function expectedPay(id) {
  return PRODUCTS[id].fair * 1.3 + state.weather.bonus;
}

// ---------- 5. הצגה על המסך ----------
function renderProducts() {
  $("products").innerHTML = stand().products.map((id) => {
    const p = PRODUCTS[id];
    const price = state.prices[id];
    const diff = expectedPay(id) - price;
    const verdict = diff >= 0.5 ? ["good", "מחיר הוגן"]
                  : diff >= -1  ? ["", "קצת יקר"]
                  :               ["bad", "יקר, לקוחות ילכו"];
    return '<li class="prod' + (state.stock[id] < 3 ? " low" : "") + '" data-id="' + id + '">' +
      '<svg class="ico"><use href="#' + p.icon + '"/></svg>' +
      '<span class="name">' + p.name + "</span>" +
      '<span class="count">' + state.stock[id] + "<small>במלאי</small></span>" +
      '<button data-act="buy" ' + (state.money < p.cost ? "disabled" : "") + ">+" + BATCH +
        ' <span class="cost">' + p.cost + " ₪</span></button>" +
      '<div class="pricing"><span class="label">מחיר</span>' +
        '<button class="small" data-act="down" aria-label="הורד מחיר"' + (price <= 1 ? " disabled" : "") + ">−</button>" +
        '<span class="price-val">' + price + " ₪</span>" +
        '<button class="small" data-act="up" aria-label="העלה מחיר"' + (price >= 20 ? " disabled" : "") + ">+</button>" +
        '<span class="verdict ' + verdict[0] + '">' + verdict[1] + "</span></div>" +
      "</li>";
  }).join("");
}

function updateScreen() {
  $("money").textContent = state.money;
  $("sold").textContent = state.sold;
  $("missed").textContent = state.missed;
  renderProducts();
}

function addMoney(amount) {
  state.money += amount;
  const cash = $("cash");
  cash.classList.remove("bump");
  void cash.offsetWidth; // טריק קטן שמאפשר להפעיל את האנימציה שוב
  cash.classList.add("bump");
}

// ---------- 6. קניות ומחירים ----------
$("products").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || btn.disabled) return;
  const id = btn.closest(".prod").dataset.id;
  const act = btn.dataset.act;

  if (act === "buy" && state.money >= PRODUCTS[id].cost) {
    state.money -= PRODUCTS[id].cost;
    state.stock[id] += BATCH;
    buySound();
  } else if (act === "up") {
    state.prices[id] = Math.min(20, state.prices[id] + 1);
  } else if (act === "down") {
    state.prices[id] = Math.max(1, state.prices[id] - 1);
  }
  updateScreen();
  save();
});

// ---------- 7. מזג אוויר והחלפת דוכן ----------
function setWeather(w) {
  const before = state.weather ? state.weather.stand : null;
  state.weather = w;
  const scene = $("scene");
  scene.className = w.cls + " mode-" + w.stand;
  $("w-name").textContent = w.name;
  // התו הנסתר ‎ שומר שהמינוס יישאר ליד המספר גם בטקסט מימין לשמאל
  $("w-temp").textContent = "‎" + w.temp + "°";

  // אם הדוכן התחלף, מפנים את הרחוב ומעדכנים שלט וכותרת
  if (before !== w.stand) {
    customers.forEach(leave);
    $("stand-title").textContent = stand().title;
    $("sign-text").textContent = stand().sign;
    if (before) toast(stand().hello);
  }

  // לפעמים יש פסטיבל ברחוב, ואז מגיעים הרבה יותר לקוחות
  state.festival = Math.random() < 0.2;
  if (state.festival) setTimeout(() => toast("פסטיבל ברחוב! הלקוחות מגיעים בהמוניהם"), before ? 2900 : 0);
  updateScreen();
}

function nextWeather() {
  setWeather(pick(WEATHERS.filter((w) => w !== state.weather)));
}

// לחיצה על שבב מזג האוויר מחליפה אותו מיד
$("weather-chip").addEventListener("click", nextWeather);

// ---------- 8. לקוחות ----------
let customers = [];

const SKIN = ["#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#ffdbac"];
const HAIR = ["#2b1b0e", "#5a3a1a", "#a0522d", "#e6c15a", "#222", "#c0392b"];
const SHIRT = ["#4dabf7", "#845ef7", "#f06595", "#20c997", "#ff922b", "#74c0fc", "#69db7c"];
const COAT = ["#495057", "#364fc7", "#862e9c", "#a61e4d", "#2b8a3e", "#c2255c"];
const HAT = ["#e5383b", "#1c7ed6", "#f59f00", "#37b24d", "#9c36b5"];

// מצייר לקוח כציור קטן (SVG) עם צבעים אקראיים. בחורף: מעיל, כובע וצעיף
function drawPerson(winter) {
  const skin = pick(SKIN), hair = pick(HAIR);
  const top = winter ? pick(COAT) : pick(SHIRT);
  let svg = '<svg class="sprite" viewBox="0 0 44 70">' +
    '<rect x="12" y="54" width="8" height="14" rx="3" fill="#33415c"/>' +
    '<rect x="24" y="54" width="8" height="14" rx="3" fill="#33415c"/>' +
    '<rect x="8" y="26" width="28" height="32" rx="10" fill="' + top + '"/>' +
    '<circle cx="22" cy="16" r="11" fill="' + skin + '"/>' +
    '<path d="M10 14c1-12 23-12 24 0-6-5-18-5-24 0z" fill="' + hair + '"/>' +
    '<circle cx="18" cy="17" r="1.6" fill="#33210f"/><circle cx="26" cy="17" r="1.6" fill="#33210f"/>' +
    '<path d="M18 22q4 3 8 0" fill="none" stroke="#33210f" stroke-width="1.6" stroke-linecap="round"/>';
  if (winter) {
    const hat = pick(HAT);
    svg += '<path d="M10 14c0-14 24-14 24 0z" fill="' + hat + '"/>' +
      '<rect x="9" y="11" width="26" height="5" rx="2.5" fill="#fff"/>' +
      '<circle cx="22" cy="3.5" r="3.5" fill="#fff"/>' +
      '<rect x="12" y="26" width="20" height="6" rx="3" fill="' + pick(HAT) + '"/>';
  }
  return svg + "</svg>";
}

function addCustomer() {
  const el = document.createElement("div");
  el.className = "customer";

  // הלקוח נכנס מצד אחד של המסך והולך אל הדוכן
  const fromLeft = Math.random() < 0.5;
  el.style.left = fromLeft ? "-14%" : "104%";
  el.style.top = random(60, 70) + "%";

  // כל לקוח רוצה מוצר אחד, ויש לו מחיר מקסימלי שהוא מוכן לשלם עליו
  const productId = pick(stand().products);
  const maxPay = expectedPay(productId) + random(-1.5, 1.5);
  const willBuy = state.prices[productId] <= maxPay;

  const c = { el, productId, patience: PATIENCE, done: false, willBuy };
  el.innerHTML = drawPerson(state.weather.stand === "winter") +
    '<span class="bubble">' + (willBuy
      ? '<svg class="want" viewBox="0 0 40 40"><use href="#' + PRODUCTS[productId].icon + '"/></svg>'
      : "יקר מדי") + "</span>" +
    '<span class="bar"><i></i></span>';
  c.bar = el.querySelector(".bar i");

  $("street").appendChild(el);
  customers.push(c);

  // רגע אחרי, מזיזים אותו לפני הדוכן, וה-CSS עושה את ההליכה החלקה
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.left = random(14, 74) + "%";
  }));
  setTimeout(() => {
    el.classList.add("arrived");
    if (c.willBuy) el.classList.add("hungry");
  }, 1800);

  if (willBuy) {
    el.addEventListener("click", () => serve(c));
  } else {
    // היקר מדי בשבילו: מציץ רגע ואז הולך
    state.missed++;
    updateScreen();
    setTimeout(() => leave(c), 2600);
  }
}

function serve(c) {
  if (c.done) return;
  const id = c.productId;
  if (state.stock[id] < 1) {
    toast("נגמר ה" + PRODUCTS[id].name + "! קנה עוד למטה");
    const row = document.querySelector('[data-id="' + id + '"]');
    if (row) {
      row.classList.remove("flash");
      void row.offsetWidth;
      row.classList.add("flash");
    }
    sadSound();
    return;
  }

  // מוכרים: מורידים מהמלאי ומקבלים כסף
  state.stock[id]--;
  state.sold++;
  const price = state.prices[id];
  addMoney(price);
  coinSound();
  popCoins(c.el, price);

  c.done = true;
  c.el.classList.add("happy");
  c.el.querySelector(".bubble").textContent = "תודה!";
  setTimeout(() => leave(c), 500);
  updateScreen();
  save();
}

function leave(c) {
  if (c.el.classList.contains("leaving")) return;
  c.done = true;
  c.el.classList.add("leaving");
  c.el.style.left = (parseFloat(c.el.style.left) < 50 ? "-14%" : "104%");
  setTimeout(() => {
    c.el.remove();
    customers = customers.filter((x) => x !== c);
  }, 1500);
}

// "+5" שעף למעלה מעל הלקוח
function popCoins(el, amount) {
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.textContent = "+" + amount + " ₪";
  pop.style.left = el.style.left;
  pop.style.top = (parseFloat(el.style.top) - 14) + "%";
  $("scene").appendChild(pop);
  setTimeout(() => pop.remove(), 1000);
}

// ---------- 9. השעון של המשחק ----------
// tick רצה עשר פעמים בשנייה
function tick() {
  const waiting = customers.filter((c) => !c.done).length;
  const boost = state.festival ? 1.8 : 1;
  if (waiting < MAX_WAITING && Math.random() < state.weather.crowd * boost * 0.04) {
    addCustomer();
  }

  customers.forEach((c) => {
    if (c.done || !c.willBuy) return;
    c.patience -= 0.1;
    c.bar.style.width = Math.max(0, (c.patience / PATIENCE) * 100) + "%";
    c.bar.style.background = c.patience < 3 ? "var(--berry)" : "var(--leaf)";
    if (c.patience <= 0) leave(c);
  });
}

// ---------- 10. מתחילים! ----------
load();
setWeather(pick(WEATHERS));
setInterval(tick, 100);
setInterval(nextWeather, WEATHER_EVERY);

</script>
</body>
</html>
