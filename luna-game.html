<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>החנות של לונה</title>
  <style>
/* Cozy, soft look for Luna's game */
:root {
  --cream: #fff6e5;
  --peach: #ffd9b8;
  --pink: #ff9eb5;
  --green: #7cc47f;
  --ink: #4a3b47;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: linear-gradient(#ffeccf, #f9d5e5);
  min-height: 100vh;
}

#app {
  max-width: 860px;
  margin: 0 auto;
  padding: 62px 16px 16px;
}

.screen { display: none; text-align: center; }
.screen.active { display: block; }

h1 { font-size: 2.4rem; margin: 8px 0; }
h2 { margin: 8px 0 12px; }
.big { font-size: 5rem; }
.hint { font-size: 0.9rem; opacity: 0.7; }

.row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 12px 0;
}

.btn {
  font-size: 1.1rem;
  padding: 10px 22px;
  border: none;
  border-radius: 999px;
  background: var(--pink);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 0 #d9738f;
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled { background: #ccc; box-shadow: 0 3px 0 #aaa; cursor: default; }
.btn.soft { background: var(--green); box-shadow: 0 3px 0 #55a058; }

#muteBtn {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 20;
  font-size: 1.3rem;
  border: none;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  background: var(--cream);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

.ico { width: 30px; height: 30px; vertical-align: middle; margin: 0 2px; }
#shopCv, #titleCv { margin-bottom: 8px; }

.canvasWrap { position: relative; }
canvas {
  width: 100%;
  height: auto;
  border-radius: 18px;
  border: 4px solid #fff;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
  touch-action: none;
}

#storyText { white-space: pre-line; }
#storyText .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
#storyText .cell { width: 110px; font-size: 0.85rem; line-height: 1.3; }
#storyText .cell img { width: 54px; height: 54px; }
#storyText .cell.locked img { filter: brightness(0); opacity: 0.2; }
#storyText .quest { text-align: right; margin: 6px 0; }
#storyText .quest.done { opacity: 0.55; text-decoration: line-through; }
#story .card { max-height: 90vh; overflow-y: auto; }

#hud, .hud {
  background: var(--cream);
  border-radius: 14px;
  padding: 8px 14px;
  margin-bottom: 8px;
  font-size: 1.05rem;
}

#toast, .toast {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.95);
  padding: 8px 16px;
  border-radius: 14px;
  max-width: 90%;
  font-size: 1.05rem;
}

/* shop */
.panel {
  background: var(--cream);
  border-radius: 18px;
  padding: 18px;
  margin: 10px 0;
}
.recipe { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; }
.customer .face { font-size: 4.5rem; }
.customer .line { font-size: 1.2rem; }

/* story pop-up */
#story {
  position: fixed;
  inset: 0;
  background: rgba(40, 25, 50, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}
#story .card {
  background: var(--cream);
  border-radius: 20px;
  padding: 24px;
  max-width: 520px;
  text-align: center;
  font-size: 1.2rem;
  line-height: 1.6;
}

</style>
</head>
<body>
  <button id="muteBtn" title="צליל">🔊</button>
  <main id="app">

    <!-- Title screen -->
    <section id="title" class="screen active">
      <canvas id="titleCv" width="800" height="300"></canvas>
      <h1>החנות של לונה</h1>
      <p>הרפתקה קטנה בהכפר הקטן וביער הקסום</p>
      <div id="titleButtons" class="row"></div>
    </section>

    <!-- Forest screen: the canvas is where Luna walks -->
    <section id="forest" class="screen">
      <div id="hud"></div>
      <div class="canvasWrap">
        <canvas id="cv" width="800" height="500"></canvas>
        <div id="toast" hidden></div>
      </div>
      <div class="row">
        <button id="backBtn" class="btn" hidden>חזרה לחנות 🏪</button>
      </div>
      <p class="hint">כדי ללכת: חיצים במקלדת, או ללחוץ על המקום שרוצים להגיע אליו.</p>
    </section>

    <!-- The big world of chapter 2 -->
    <section id="world" class="screen">
      <div id="whud" class="hud"></div>
      <div class="canvasWrap">
        <canvas id="wcv" width="800" height="500"></canvas>
        <div id="wtoast" class="toast" hidden></div>
      </div>
      <div class="row">
        <button id="actBtn" class="btn" hidden></button>
        <button id="questBtn" class="btn soft">📜 משימות</button>
        <button id="albumBtn" class="btn soft">📖 אלבום האוצרות</button>
      </div>
      <p class="hint">ללכת: חיצים או לחיצה על המסך. לפעולה: הכפתור הוורוד, או מקש E או רווח.</p>
    </section>

    <!-- Shop screen: a picture of the shop on top, buttons below -->
    <section id="shop" class="screen">
      <canvas id="shopCv" width="800" height="300"></canvas>
      <div id="shopUi"></div>
    </section>

    <!-- Story pop-up -->
    <div id="story" hidden>
      <div class="card">
        <p id="storyText"></p>
        <div id="storyButtons" class="row"></div>
      </div>
    </div>

  </main>
  <script>
'use strict';

/* All the drawings in the game are made here with code: shapes, colours and a little maths.
   Every function draws on a canvas "c". x,y is where the thing STANDS (its feet), s is its size. */
const Art = (() => {
  const TAU = Math.PI * 2;

  /* ---------- tiny helpers ---------- */
  function ell(c, x, y, rx, ry, fill, rot) {
    c.fillStyle = fill;
    c.beginPath();
    c.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
    c.fill();
  }
  function tri(c, x1, y1, x2, y2, x3, y3, fill) {
    c.fillStyle = fill;
    c.beginPath();
    c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3);
    c.closePath();
    c.fill();
  }
  function shadow(c, rx) { ell(c, 0, 0, rx, rx * 0.3, 'rgba(0,0,0,0.18)'); }
  function at(c, x, y, s, fn) {
    c.save(); c.translate(x, y); c.scale(s, s); fn(); c.restore();
  }
  function eyes(c, lx, rx, y, t, r) {
    const blink = (Math.floor(t) % 220) < 6;
    [lx, rx].forEach(x => {
      ell(c, x, y, r, blink ? 0.8 : r * 1.25, '#2b2230');
      if (!blink) ell(c, x - r * 0.3, y - r * 0.5, r * 0.35, r * 0.35, '#fff');
    });
  }

  /* ---------- Luna the cat ---------- */
  function cat(c, x, y, s, o) {
    const t = o.t || 0, walk = !!o.walking;
    const sw = walk ? Math.sin(t * 0.5) * 5 : 0;                    // leg swing
    const bob = walk ? Math.abs(Math.sin(t * 0.5)) * 2 : Math.sin(t * 0.08) * 0.8;
    const tw = Math.sin(t * (walk ? 0.3 : 0.12)) * 8;                // tail wag
    at(c, x, y, s, () => {
      c.scale(o.dir || 1, 1);
      shadow(c, 26);
      // tail
      c.strokeStyle = '#d97f35'; c.lineWidth = 8; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-18, -22 - bob);
      c.quadraticCurveTo(-40, -22 + tw, -36 + tw * 0.5, -50 + tw);
      c.stroke();
      // back legs, body, belly, front legs
      ell(c, -12 + sw, -6, 7, 8, '#d97f35');
      ell(c, 8 - sw, -6, 7, 8, '#d97f35');
      ell(c, 0, -26 - bob, 23, 16, '#f0a259');
      ell(c, 3, -20 - bob, 13, 8, '#fbe3c0');
      ell(c, -4 - sw, -6, 7, 8, '#f0a259');
      ell(c, 16 + sw, -6, 7, 8, '#f0a259');
      // head
      const hx = 16, hy = -46 - bob;
      tri(c, hx - 16, hy - 4, hx - 13, hy - 27, hx - 1, hy - 13, '#f0a259');
      tri(c, hx + 16, hy - 4, hx + 13, hy - 27, hx + 1, hy - 13, '#f0a259');
      tri(c, hx - 13, hy - 8, hx - 12, hy - 21, hx - 5, hy - 12, '#ffb5c5');
      tri(c, hx + 13, hy - 8, hx + 12, hy - 21, hx + 5, hy - 12, '#ffb5c5');
      ell(c, hx, hy, 18, 15, '#f0a259');
      ell(c, hx, hy + 6, 11, 7, '#fbe3c0');
      c.strokeStyle = '#d97f35'; c.lineWidth = 2.5;
      [-5, 0, 5].forEach(d => { c.beginPath(); c.moveTo(hx + d, hy - 15); c.lineTo(hx + d, hy - 9); c.stroke(); });
      eyes(c, hx - 8, hx + 8, hy - 1, t, 3);
      tri(c, hx - 2.5, hy + 3, hx + 2.5, hy + 3, hx, hy + 6.5, '#ff8aa5');
      c.strokeStyle = '#7a4a2a'; c.lineWidth = 1.3;
      c.beginPath(); c.arc(hx - 2.5, hy + 7, 2.5, 0, Math.PI); c.stroke();
      c.beginPath(); c.arc(hx + 2.5, hy + 7, 2.5, 0, Math.PI); c.stroke();
      c.strokeStyle = 'rgba(80,50,30,0.5)'; c.lineWidth = 1;
      [[-10, 5, -27, 2], [-10, 7, -27, 9], [10, 5, 27, 2], [10, 7, 27, 9]].forEach(w => {
        c.beginPath(); c.moveTo(hx + w[0], hy + w[1]); c.lineTo(hx + w[2], hy + w[3]); c.stroke();
      });
    });
  }

  /* ---------- Friends of the forest (head and shoulders) ---------- */
  const BODY = { bunny: '#f4efe9', owl: '#a07650', bear: '#8f633f', bird: '#6fb3e8', fox: '#e8793a', hedgehog: '#7a5a3d' };
  const HEAD = { bunny: '#f8f4ee', owl: '#b08560', bear: '#a3734a', bird: '#86c4f0', fox: '#f08a4b', hedgehog: '#f0d2a8' };
  const BELLY = { bunny: '#ffffff', owl: '#e8d2b0', bear: '#c99a6e', bird: '#d8efff', fox: '#fff1e0', hedgehog: '#f0d2a8' };

  function animal(c, kind, x, y, s, t) {
    const bob = Math.sin(t * 0.07) * 1.5;
    at(c, x, y + bob, s, () => {
      shadow(c, 34);

      // things behind the head
      if (kind === 'bunny') {
        const sw = Math.sin(t * 0.05) * 3;
        ell(c, -11 - sw, -100, 7, 24, HEAD.bunny, -0.1); ell(c, -11 - sw, -98, 3.5, 17, '#ffc2d1', -0.1);
        ell(c, 11 + sw, -100, 7, 24, HEAD.bunny, 0.1);   ell(c, 11 + sw, -98, 3.5, 17, '#ffc2d1', 0.1);
      } else if (kind === 'hedgehog') {
        for (let i = 0; i < 15; i++) {
          const a = Math.PI + (i + 0.5) * Math.PI / 15, a2 = a + 0.2, a1 = a - 0.2;
          tri(c, Math.cos(a1) * 27, -60 + Math.sin(a1) * 27, Math.cos(a2) * 27, -60 + Math.sin(a2) * 27,
            Math.cos(a) * 44, -60 + Math.sin(a) * 44, '#4a3524');
        }
      } else if (kind === 'owl') {
        tri(c, -26, -76, -16, -98, -8, -80, BODY.owl);
        tri(c, 26, -76, 16, -98, 8, -80, BODY.owl);
      } else if (kind === 'fox') {
        tri(c, -26, -74, -20, -100, -6, -82, HEAD.fox); tri(c, -22, -80, -20, -95, -13, -83, '#3b2a22');
        tri(c, 26, -74, 20, -100, 6, -82, HEAD.fox);    tri(c, 22, -80, 20, -95, 13, -83, '#3b2a22');
      } else if (kind === 'bear') {
        ell(c, -21, -83, 10, 10, HEAD.bear); ell(c, -21, -83, 5, 5, '#d7a37a');
        ell(c, 21, -83, 10, 10, HEAD.bear);  ell(c, 21, -83, 5, 5, '#d7a37a');
      } else if (kind === 'bird') {
        c.strokeStyle = HEAD.bird; c.lineWidth = 4; c.lineCap = 'round';
        [-6, 0, 6].forEach(d => { c.beginPath(); c.moveTo(d, -84); c.lineTo(d * 1.6, -97 + Math.abs(d) * 0.6); c.stroke(); });
      }

      // body and head
      ell(c, 0, -22, 30, 24, BODY[kind]);
      if (kind !== 'hedgehog') ell(c, 0, -17, 18, 16, BELLY[kind]);
      if (kind === 'bird') {
        const fl = Math.sin(t * 0.1) * 0.15;
        ell(c, -31, -26, 8, 18, '#5aa0d8', 0.3 + fl); ell(c, 31, -26, 8, 18, '#5aa0d8', -0.3 - fl);
      }
      if (kind === 'owl') {
        c.strokeStyle = '#b79a72'; c.lineWidth = 2;
        [[-8, -26], [8, -26], [0, -18], [-9, -12], [9, -12]].forEach(p => {
          c.beginPath(); c.arc(p[0], p[1], 5, 0.1, Math.PI - 0.1); c.stroke();
        });
      }
      ell(c, 0, -62, kind === 'owl' ? 28 : 27, 24, HEAD[kind]);

      // face
      if (kind === 'owl') {
        ell(c, -12, -64, 11, 11, '#f6ecd8'); ell(c, 12, -64, 11, 11, '#f6ecd8');
        eyes(c, -12, 12, -64, t, 4.5);
        tri(c, -4.5, -57, 4.5, -57, 0, -47, '#f2a33a');
      } else {
        eyes(c, -10, 10, -65, t, 3.6);
      }
      if (kind === 'fox') {
        ell(c, -12, -52, 13, 9, '#fff1e0'); ell(c, 12, -52, 13, 9, '#fff1e0');
        ell(c, 0, -54, 4.5, 3.2, '#2b2230');
      } else if (kind === 'bear') {
        ell(c, 0, -54, 12, 9, '#d7a37a');
        ell(c, 0, -58, 4.5, 3.2, '#3b2a22');
      } else if (kind === 'bunny') {
        ell(c, 0, -57, 3.5, 2.5, '#ff9fb4');
        c.fillStyle = '#fff'; c.strokeStyle = '#d8c8c0'; c.lineWidth = 1;
        c.fillRect(-3, -53, 6, 6); c.strokeRect(-3, -53, 6, 6);
      } else if (kind === 'hedgehog') {
        ell(c, 0, -56, 18, 14, '#f0d2a8');
        ell(c, 0, -57, 4.5, 3.5, '#2b2230');
        eyes(c, -10, 10, -65, t, 3.6);
      } else if (kind === 'bird') {
        tri(c, -6, -60, 6, -60, 0, -49, '#f6a93b');
      }
      if (kind === 'bunny' || kind === 'bear' || kind === 'bird') {
        c.fillStyle = 'rgba(255,130,150,0.35)';
        c.beginPath(); c.arc(-19, -56, 5, 0, TAU); c.arc(19, -56, 5, 0, TAU); c.fill();
      }
    });
  }

  /* ---------- Forest things ---------- */
  function tree(c, x, y, s, t, seed, kind) {
    const sway = Math.sin(t * 0.025 + seed) * 2.5;
    at(c, x, y, s, () => {
      shadow(c, 32);
      if (kind === 'pine') {
        c.fillStyle = '#7a5230'; c.fillRect(-5, -18, 10, 18);
        const cols = ['#2f7a52', '#3a8d5c', '#48a06a'];
        for (let i = 0; i < 3; i++) {
          const by = -14 - i * 26, w = 44 - i * 9;
          tri(c, -w, by, w, by, sway * (i + 1) * 0.6, by - 46, cols[i]);
        }
      } else {
        c.fillStyle = '#8a5a34'; c.fillRect(-7, -42, 14, 42);
        ell(c, sway * 0.6, -64, 32, 28, '#3f9a55');
        ell(c, -24 + sway * 0.6, -50, 22, 20, '#459f5b');
        ell(c, 24 + sway * 0.6, -50, 22, 20, '#459f5b');
        ell(c, sway * 1.1, -82, 22, 19, '#58b96e');
        ell(c, -8 + sway, -88, 9, 6, 'rgba(255,255,255,0.18)');
      }
    });
  }

  function bush(c, x, y, s) {
    at(c, x, y, s, () => {
      shadow(c, 24);
      ell(c, -12, -12, 14, 12, '#3f9a55'); ell(c, 12, -12, 14, 12, '#3f9a55'); ell(c, 0, -18, 15, 13, '#4aa862');
    });
  }

  function flower(c, x, y, s, t, seed) {
    const sw = Math.sin((t || 0) * 0.05 + (seed || 0)) * 3;
    at(c, x, y, s, () => {
      shadow(c, 10);
      c.strokeStyle = '#4d9a52'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(0, -12, sw, -22); c.stroke();
      ell(c, -5, -9, 5, 2.5, '#5cae60', -0.5);
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5;
        ell(c, sw + Math.cos(a) * 6.5, -24 + Math.sin(a) * 6.5, 5.5, 5.5, '#ff8fb1');
      }
      ell(c, sw, -24, 4, 4, '#ffd84d');
    });
  }

  function berry(c, x, y, s, t, seed) {
    const sw = Math.sin((t || 0) * 0.04 + (seed || 0)) * 1.5;
    at(c, x, y, s, () => {
      shadow(c, 14);
      ell(c, -8, -8, 8, 5, '#4aa862', -0.4); ell(c, 8, -8, 8, 5, '#4aa862', 0.4); ell(c, 0, -10, 7, 5, '#5cae60');
      [[-6, -14], [7, -13], [0, -19]].forEach(p => {
        const px = p[0] + sw, py = p[1];
        c.fillStyle = '#e8394d';
        c.beginPath(); c.moveTo(px - 6, py - 4); c.quadraticCurveTo(px, py - 8, px + 6, py - 4);
        c.quadraticCurveTo(px + 4, py + 6, px, py + 8); c.quadraticCurveTo(px - 4, py + 6, px - 6, py - 4); c.fill();
        c.fillStyle = '#ffe9a0';
        [[-2, -2], [2, 0], [-1, 3]].forEach(d => c.fillRect(px + d[0], py + d[1], 1.3, 1.3));
        ell(c, px, py - 6, 5, 2, '#3f9a55');
      });
    });
  }

  function mushroom(c, x, y, s) {
    at(c, x, y, s, () => {
      shadow(c, 13);
      c.fillStyle = '#f7ead2'; c.beginPath();
      c.moveTo(-5, 0); c.lineTo(-4, -12); c.lineTo(4, -12); c.lineTo(5, 0); c.closePath(); c.fill();
      c.fillStyle = '#e0483f'; c.beginPath();
      c.ellipse(0, -13, 14, 11, 0, Math.PI, TAU); c.closePath(); c.fill();
      [[-6, -17, 2.5], [4, -20, 2.2], [8, -15, 1.8], [-1, -14, 1.8]].forEach(d => ell(c, d[0], d[1], d[2], d[2], '#fff'));
    });
  }

  function firefly(c, x, y, t) {
    const pulse = 0.75 + Math.sin(t * 0.12) * 0.25;
    const g = c.createRadialGradient(x, y, 2, x, y, 48);
    g.addColorStop(0, 'rgba(255,240,130,' + (0.9 * pulse) + ')');
    g.addColorStop(1, 'rgba(255,240,130,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, 48, 0, TAU); c.fill();
    const flap = Math.sin(t * 0.7) * 0.4;
    ell(c, x - 6, y - 5, 7, 3.5, 'rgba(255,255,255,0.7)', -0.6 + flap);
    ell(c, x + 6, y - 5, 7, 3.5, 'rgba(255,255,255,0.7)', 0.6 - flap);
    ell(c, x, y, 3.5, 5, '#fff7b0');
  }

  /* ---------- Shop food ---------- */
  function potion(c, x, y, s, t) {
    at(c, x, y, s, () => {
      shadow(c, 13);
      ell(c, 0, -12, 11, 11, '#ff9ed2');
      ell(c, 0, -9, 9, 6, '#ff6fb8');
      ell(c, -4, -16, 3, 4, 'rgba(255,255,255,0.7)', 0.5);
      c.fillStyle = 'rgba(200,230,255,0.85)'; c.fillRect(-3.5, -30, 7, 12);
      c.fillStyle = '#a86b3c'; c.fillRect(-4.5, -34, 9, 5);
    });
  }
  function cake(c, x, y, s) {
    at(c, x, y, s, () => {
      ell(c, 0, -1, 16, 4, '#f4f4ff');
      c.fillStyle = '#f6d7a7'; c.fillRect(-11, -14, 22, 12);
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, -14, 12, 4, 0, 0, TAU); c.fill();
      c.fillStyle = '#ffd9e6'; c.fillRect(-11, -9, 22, 2.5);
      ell(c, 0, -19, 5, 5, '#e8394d'); ell(c, 0, -23, 3.5, 1.8, '#3f9a55');
    });
  }
  function soup(c, x, y, s, t) {
    at(c, x, y, s, () => {
      shadow(c, 15);
      ell(c, 0, -13, 13, 4, '#e8a05a');
      c.fillStyle = '#8fb8e0'; c.beginPath();
      c.ellipse(0, -13, 14, 14, 0, 0, Math.PI); c.closePath(); c.fill();
      ell(c, 0, -13, 13, 3.8, '#f0b068');
      ell(c, -4, -14, 3, 1.8, '#e0483f'); ell(c, 3, -13, 2.5, 1.6, '#f7ead2');

  function sparkle(c, x, y, t) {

  function house(c, x, y, s, roof, sign, t) {
    at(c, x, y, s, () => {
      shadow(c, 80);
      c.fillStyle = '#f3e2c3'; c.fillRect(-60, -80, 120, 80);

  const WPATH = [[250, 360], [330, 420], [500, 470], [760, 520], [1000, 580], [1110, 600], [1300, 600], [1450, 585]];

  /* ---------- The inside of the shop ---------- */
  const JARS = [[330, 100, '#ffb3c7'], [372, 100, '#b9e6a8'], [414, 100, '#ffe08a'], [456, 100, '#c9b6ff'],

  function shopScene(c, W, H, t, st) {

    if (st.evening) { sky.addColorStop(0, '#4b3d7a'); sky.addColorStop(1, '#f19a6b'); }

    if (st.evening) {
      ell(c, 160, 62, 12, 12, '#fff6c8');
      [[80, 50], [110, 70], [140, 45], [95, 95]].forEach((p, i) => ell(c, p[0], p[1], 1.6, 1.6, 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(t * 0.05 + i)) + ')'));
    } else {
      ell(c, 150, 70, 14, 14, '#ffe27a'); ell(c, 100, 90, 20, 8, 'rgba(255,255,255,0.9)'); ell(c, 118, 86, 14, 8, 'rgba(255,255,255,0.9)');
    }

    c.fillStyle = '#8a5a34';

    JARS.forEach(j => {
      const jy = j[1] + 28;
      ell(c, j[0], jy - 12, 13, 15, j[2]);

    c.strokeStyle = '#4a3b47'; c.lineWidth = 2; c.beginPath(); c.moveTo(450, 0); c.lineTo(450, 28); c.stroke();

    c.fillStyle = '#4a3b47'; c.fillRect(440, 26, 20, 6);
    ell(c, 450, 44, 10, 14, '#ffe9a0');
    c.fillStyle = '#4a3b47'; c.fillRect(440, 56, 20, 5);

    // Luna behind the counter, and the customer in front of it
    const base = H - 86;
    cat(c, 210, base + 18, 1.5, { dir: 1, t: t, walking: false });
    if (st.kind) {
      const k = Math.min(1, st.arrive || 1);

    // counter
    c.fillStyle = '#7a4a2a'; c.fillRect(0, H - 86, W, 86);

  <script>
'use strict';

/* Sounds and music made with code (no sound files needed).
   Browsers only allow sound after the first click or key press, so init() runs then. */
const Sound = (() => {
  let ac = null, master = null, timer = null, drone = null;
  let muted = false, mode = 'calm', tick = 0;

  const CALM = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3];   // gentle, happy notes
  const TENSE = [110.0, 130.8, 146.8, 155.6, 98.0];                  // low, worried notes

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ac.destination);
    restart();
  }

  // One soft note
  function tone(freq, when, dur, type, vol) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t0 = ac.currentTime + (when || 0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function stopDrone() {
    if (drone) { try { drone.stop(); } catch (e) { /* already stopped */ } drone = null; }
  }

  function startDrone() {
    stopDrone();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = 55;
    g.gain.value = 0.09;
    o.connect(g); g.connect(master); o.start();
    drone = o;
  }

  function restart() {
    clearInterval(timer);
    if (!ac) return;
    tick = 0;
    if (mode === 'tense') startDrone(); else stopDrone();
    timer = setInterval(() => {
      tick++;
      if (mode === 'calm') {
        if (Math.random() < 0.65) tone(CALM[Math.floor(Math.random() * CALM.length)], 0, 1.8, 'triangle', 0.09);
        if (tick % 8 === 0) tone(CALM[0] / 2, 0, 3, 'sine', 0.08);
      } else {
        tone(TENSE[Math.floor(Math.random() * TENSE.length)], 0, 1.4, 'sine', 0.14);
        if (tick % 5 === 0) tone(740 + Math.random() * 60, 0, 0.6, 'sine', 0.03);
      }
    }, mode === 'calm' ? 600 : 900);
  }

  function setMode(m) {
    if (m === mode) return;
    mode = m;
    restart();
  }

  // Short sound effects
  function play(name) {
    if (!ac) return;
    switch (name) {
      case 'pick':   tone(660, 0, 0.18, 'triangle', 0.2); tone(880, 0.09, 0.25, 'triangle', 0.2); break;
      case 'craft':  tone(392, 0, 0.15, 'sine', 0.2); tone(523, 0.1, 0.15, 'sine', 0.2); tone(659, 0.2, 0.3, 'sine', 0.2); break;
      case 'serve':  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.4, 'triangle', 0.2)); break;
      case 'soft':   tone(440, 0, 0.3, 'sine', 0.15); tone(392, 0.15, 0.4, 'sine', 0.15); break;
      case 'spark':  [880, 1175, 1568, 2093].forEach((f, i) => tone(f, i * 0.07, 0.35, 'sine', 0.12)); break;
      case 'whoosh': tone(300, 0, 0.5, 'sawtooth', 0.05); tone(150, 0.1, 0.6, 'sawtooth', 0.05); break;
      case 'lost':   tone(196, 0, 1.2, 'sine', 0.2); tone(185, 0.4, 1.4, 'sine', 0.2); tone(147, 0.9, 1.8, 'sine', 0.2); break;
      case 'win':    [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.18, 0.9, 'triangle', 0.18)); break;
      case 'click':  tone(520, 0, 0.08, 'triangle', 0.1); break;
    }
  }

  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.5;
    return muted;
  }

  return { init, play, setMode, toggleMute };
})();

/* ================= Saved state ================= */
function fresh() {
  return {
    chapter: 1, day: 1, coins: 0,
    inv: { flower: 0, berry: 0, mushroom: 0, potion: 0, cake: 0, soup: 0, pie: 0, fish: 0 },
    q: { scarf: 0, fish: 0, bridge: 0, potion: 0 },   // 0 = not asked, 1 = on it, 2 = done
    planks: 0, plankGot: [false, false, false], bridge: false,
    scarfFound: false, digFound: false, treasures: {}, ch2done: false,
  };
}
function load() {
  const base = fresh();
  try {
    const s = JSON.parse(localStorage.getItem('luna'));
    if (s && s.day) {
      // fill in anything a saved game from an older version does not have yet
      return Object.assign(base, s, {
        inv: Object.assign(base.inv, s.inv), q: Object.assign(base.q, s.q),
        treasures: Object.assign({}, s.treasures),
      });
    }
  } catch (e) { /* no saved game */ }
  return base;
}
function save() {
  try { localStorage.setItem('luna', JSON.stringify(S)); } catch (e) { /* ignore */ }
}
let S = load();

/* ================= Small helpers ================= */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const ico = k => '<img class="ico" alt="" src="' + Art.icon(k) + '">';

function el(tag, text, cls) {
  const x = document.createElement(tag);
  if (text) x.textContent = text;
  if (cls) x.className = cls;
  return x;
}
function button(label, fn, cls, disabled) {
  const b = el('button', label, 'btn' + (cls ? ' ' + cls : ''));
  b.disabled = !!disabled;
  b.addEventListener('click', () => { Sound.play('click'); fn(); });
  return b;
}

let currentScreen = 'title';
function show(name) {
  currentScreen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === name));
}

// Pop-up with text and buttons: story('...', [{label, fn}]). With html=true the text may contain our own HTML.
function story(text, buttons, html) {
  if (html) $('storyText').innerHTML = text; else $('storyText').textContent = text;
  const row = $('storyButtons');
  row.innerHTML = '';
  buttons.forEach(b => row.append(button(b.label, () => { $('story').hidden = true; b.fn(); })));
  $('story').hidden = false;
}

let toastTimer = null;
function toast(msg) {
  const t = $(currentScreen === 'world' ? 'wtoast' : 'toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

/* ================= Forest ================= */
const cv = $('cv'), ctx = cv.getContext('2d');
const keys = {};
let F = null;     // the forest state, rebuilt each morning

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('pointerdown', e => {
  if (!F) return;
  const r = cv.getBoundingClientRect();
  F.target = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
});

function startForest() {
  show('forest');
  Sound.setMode('calm');
  F = {
    luna: { x: W / 2, y: H / 2 + 20 }, target: null, dir: 1, moving: false,
    items: [], trees: [], bushes: [], leaves: [], friend: null,
    collected: 0, t: 0, paused: false,
    lost: false, step: 0, lantern: 0, fire: null, waiting: 0,
  };
  for (let i = 0; i < 20; i++) {
    F.trees.push({ x: rand(20, W - 20), y: rand(90, H - 5), s: rand(0.8, 1.2), seed: rand(0, 6), kind: Math.random() < 0.5 ? 'pine' : 'oak' });
  }
  for (let i = 0; i < 8; i++) F.bushes.push({ x: rand(20, W - 20), y: rand(80, H - 10), s: rand(0.9, 1.3) });
  for (let i = 0; i < 14; i++) F.leaves.push({ x0: rand(0, W), y0: rand(0, H), sp: rand(0.25, 0.6), ph: rand(0, 6) });
  const spawn = { flower: 5, berry: 4, mushroom: 3 };
  for (const type in spawn) {
    for (let i = 0; i < spawn[type]; i++) F.items.push({ type, x: rand(40, W - 40), y: rand(70, H - 30), seed: rand(0, 6) });
  }
  F.friend = { x: rand(120, W - 120), y: rand(130, H - 60), talked: false };
  $('backBtn').hidden = true;
  $('toast').hidden = true;
  updateHud();
}

function updateHud() {
  let html = '☀️ יום ' + S.day + ' &nbsp;|&nbsp; ';
  for (const k in ITEMS) html += ico(k) + ' ' + S.inv[k] + ' &nbsp; ';
  if (F && F.lost) html += ' &nbsp;|&nbsp; 🏪 בחנות מחכים ללונה: ' + F.waiting;
  $('hud').innerHTML = html;
}

function update() {
  if (F.paused) return;
  F.t++;
  const L = F.luna;

  // Movement from keys, or toward the clicked spot
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (dx || dy) {
    F.target = null;
  } else if (F.target) {
    const d = dist(L, F.target);
    if (d < 4) F.target = null;
    else { dx = (F.target.x - L.x) / d; dy = (F.target.y - L.y) / d; }
  }
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  F.moving = len > 0.05;
  if (dx > 0.1) F.dir = 1;
  if (dx < -0.1) F.dir = -1;
  L.x += dx * 3.2;
  L.y += dy * 3.2;

  // Edges: a wall in the daytime; when lost, the forest "moves the path"
  if (L.x < 8 || L.x > W - 8 || L.y < 55 || L.y > H - 8) {
    if (F.lost) {
      L.x = rand(100, W - 100); L.y = rand(120, H - 60); F.target = null;
      Sound.play('whoosh');
      toast('השביל זז! היער משנה צורה...');
    } else {
      L.x = Math.min(W - 8, Math.max(8, L.x));
      L.y = Math.min(H - 8, Math.max(55, L.y));
    }
  }

  // Pick up things
  for (let i = F.items.length - 1; i >= 0; i--) {
    const it = F.items[i];
    if (dist(L, it) < 30) {
      F.items.splice(i, 1);
      S.inv[it.type]++;
      F.collected++;
      save();
      updateHud();
      Sound.play('pick');
      toast('+1 ' + ITEMS[it.type].n);
      if (S.day < 4 && F.collected >= 3) $('backBtn').hidden = false;
      if (S.day === 4 && !F.lost && F.collected >= 2) { startLost(); return; }
    }
  }

  // Chat with the bunny
  if (F.friend && !F.friend.talked && dist(L, F.friend) < 50) {
    F.friend.talked = true;
    toast(FRIEND_LINES[S.day - 1]);
  }

  // Follow the fireflies
  if (F.lost && F.fire && dist(L, F.fire) < 34) caught();
}

/* ----- The day Luna gets lost ----- */
function startLost() {
  F.paused = true;
  Sound.setMode('tense');
  Sound.play('lost');
  story('פתאום יורד ערפל. כל השבילים נראים אותו דבר... לונה מסתובבת ומסתובבת, ואין שום דרך חזרה. היא הלכה לאיבוד ביער הקסום. 😿',
    [{ label: 'ממשיכה ללכת', fn: () => {
      F.paused = false; F.lost = true; F.items = []; F.friend = null;
      F.waiting = 1; newFirefly(); $('backBtn').hidden = true; updateHud();
    } }]);
}

function newFirefly() {
  let p;
  do { p = { x: rand(70, W - 70), y: rand(110, H - 50) }; } while (dist(p, F.luna) < 220);
  F.fire = p;
}

function caught() {
  F.step++;
  F.lantern = F.step;
  F.waiting += 2;
  updateHud();
  Sound.play('spark');
  const s = F.step;
  const next = () => { F.paused = false; newFirefly(); };

  if (s === 1) {
    toast('בובו: עקבי אחרי האורות, לונה! 🦉');
    newFirefly();
  } else if (s === 2) {
    F.paused = true;
    story('🏪 בחנות של לונה: השמש שוקעת. נוני הארנב דופק בדלת ושואל: "לונה? את שם?" אבל החנות חשוכה. כמה לקוחות מתאספים ומתלחשים בדאגה.',
      [{ label: 'חוזרים ללונה', fn: next }]);
  } else if (s === 3) {
    toast('מרחוק נדלק פנס! הכפר מאיר לך את הדרך 🏮');
    newFirefly();
  } else if (s === 4) {
    F.paused = true;
    story('🏘️ הכפר הקטן: בובו הינשוף מספר לכולם שלונה לא חזרה מהיער. כולם יוצאים עם פנסים לחפש. דובי אומר: "נדליק אור גדול, שהיא תראה אותנו מרחוק!"',
      [{ label: 'חוזרים ללונה', fn: next }]);
  } else {
    F.fire = null;
    F.paused = true;
    finale();
  }
}

function finale() {
  story('בעומק היער לונה מוצאת עץ ענק ושקט. זה עץ הכוכבים, שמדליק את כל האורות של היער. הוא דעך כי כבר הרבה זמן אף אחד לא בא לומר לו תודה.',
    [{ label: 'לחבק את העץ 💛', fn: () => {
      Sound.setMode('calm');
      Sound.play('win');
      story('לונה מחבקת אותו וממלמלת תודה. העץ מתחיל לזרוח, והערפל מתפזר! שביל זוהר נפתח מולה, כל הדרך עד הכפר הקטן.',
        [{ label: 'הולכים הביתה 🏡', fn: () => {
          story('בהכפר הקטן כולם מחכים עם פנסים וחיבוקים. דובי מרים את לונה באוויר, ונוני רוקד מרוב שמחה. החנות של לונה נפתחת מחדש, והפעם יש בה גם קסם של היער. 🌟',
            [{ label: 'סוף פרק 1 💛', fn: () => {
              S.chapter = 2; S.day = 5; save();
              story('פרק 2: האגם והנהר. כמה ימים אחרי, לונה מרימה את מבטה בלילה ורואה שמשהו לא בסדר: הכוכבים בשמיים הולכים ונעלמים אחד אחרי השני. היא חייבת לגלות למה. הפעם היער הוא רק חלק קטן מהעולם: יש גם אגם, נהר, וגשר שנשבר...',
                [{ label: 'מתחילים את פרק 2 🌍', fn: startDay }]);
            } }]);
        } }]);
    } }]);

/* ----- Drawing the forest ----- */
function drawForest() {
  const t = F.t, L = F.luna;
  Art.ground(ctx, W, H, t, F.lost);

  // Everything tall is drawn from back to front, so Luna can walk behind trees
  const things = [];
  F.bushes.forEach(b => things.push({ y: b.y, draw: () => Art.bush(ctx, b.x, b.y, b.s) }));
  F.trees.forEach(tr => things.push({ y: tr.y, draw: () => Art.tree(ctx, tr.x, tr.y, tr.s, t, tr.seed, tr.kind) }));
  if (F.friend) things.push({ y: F.friend.y, draw: () => Art.animal(ctx, 'bunny', F.friend.x, F.friend.y, 0.6, t) });
  const lunaDraw = () => Art.cat(ctx, L.x, L.y, 0.95, { dir: F.dir, t: t, walking: F.moving });
  if (!F.lost) things.push({ y: L.y, draw: lunaDraw });
  things.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // Things to collect are drawn on top so trees never hide them
  F.items.forEach(it => Art[it.type](ctx, it.x, it.y, 1.2, t, it.seed));

  if (F.target) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;

  // Every lantern the village lights makes her little circle of light bigger.

    [{ label: 'בוקר חדש ☀️', fn: startDay }]);

    [S.q.scarf, 'נוני: למצוא את הצעיף האדום ליד האגם'],
    [S.q.fish, 'דובי: להביא 2 דגים (' + Math.min(S.inv.fish, 2) + '/2)'],
    [S.q.bridge, 'בובו: להביא 3 קרשים ולתקן את הגשר (' + S.planks + '/3)'],
    [S.q.potion, 'ציפי: להביא שיקוי פרחים'],
  ].filter(r => r[0] >= 1);
  let html = '<b>📜 המשימות של לונה</b><br>';
  html += rows.length ? rows.map(r => '<div class="quest' + (r[0] === 2 ? ' done' : '') + '">• ' + r[1] + '</div>').join('')
                      : 'עוד אין משימות. דברי עם החברים בכפר!';
  html += '<br><b>המטרה הגדולה:</b> למצוא 3 שברי כוכב (' + shardCount() + '/3)';
  story(html, [{ label: 'סגירה', fn: () => {} }], true);
}

function showAlbum() {
  let html = '<b>📖 אלבום האוצרות</b><div class="grid">';
  for (const id in TREASURES) {
    const t = TREASURES[id], got = S.treasures[id];
    html += '<div class="cell' + (got ? '' : ' locked') + '"><img src="' + Art.icon(t.icon) + '" alt=""><br>' + (got ? t.n : 'עוד לא נמצא') + '</div>';
  }
  html += '</div>';
  story(html, [{ label: 'סגירה', fn: () => {} }], true);
}

$('questBtn').addEventListener('click', e => { e.currentTarget.blur(); Sound.play('click'); showQuests(); });
$('albumBtn').addEventListener('click', e => { e.currentTarget.blur(); Sound.play('click'); showAlbum(); });
$('actBtn').addEventListener('click', e => { e.currentTarget.blur(); doAct(); });
addEventListener('keydown', e => {
  if (currentScreen === 'world' && ['KeyE', 'Space', 'Enter'].includes(e.code) && $('story').hidden) {
    e.preventDefault();
    doAct();
  }
});
wcv.addEventListener('pointerdown', e => {
  if (!WR) return;
  const r = wcv.getBoundingClientRect();
  WR.target = { x: (e.clientX - r.left) * 800 / r.width + WR.cam.x, y: (e.clientY - r.top) * 500 / r.height + WR.cam.y };
});

/* ---------- Every frame: move, collect, find what's nearby ---------- */
function updateWorld() {
  const w = WR;
  if (!$('story').hidden) return;
  w.t++;
  const L = w.luna;

  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (dx || dy) {
    w.target = null;
  } else if (w.target) {
    const d = dist(L, w.target);
    if (d < 4) w.target = null;
    else { dx = (w.target.x - L.x) / d; dy = (w.target.y - L.y) / d; }
  }
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  if (w.fishing && len > 0.05) { w.fishing = null; toast('לונה אספה את החכה.'); }

  // Walk, but never into water or walls (try each direction separately so she slides along them)
  const before = { x: L.x, y: L.y };
  if (!w.fishing) {
    const nx = L.x + dx * 3.4, ny = L.y + dy * 3.4;
    if (!blocked(nx, L.y)) L.x = nx;
    if (!blocked(L.x, ny)) L.y = ny;
  }
  L.x = Math.min(WW - 15, Math.max(15, L.x));
  L.y = Math.min(WH - 8, Math.max(60, L.y));
  w.moving = Math.hypot(L.x - before.x, L.y - before.y) > 0.3;
  if (w.target && !w.moving && len > 0.05 && ++w.stuck > 20) { w.target = null; w.stuck = 0; }
  if (w.moving) w.stuck = 0;
  if (dx > 0.1) w.dir = 1;
  if (dx < -0.1) w.dir = -1;
  w.cam.x = Math.min(WW - 800, Math.max(0, L.x - 400));
  w.cam.y = Math.min(WH - 500, Math.max(0, L.y - 320));

  // Pick up things lying around
  for (let i = w.items.length - 1; i >= 0; i--) {
    const it = w.items[i];
    if (dist(L, it) < 30) {
      w.items.splice(i, 1);
      S.inv[it.type]++;
      save();
      updateWorldHud();
      Sound.play('pick');
      toast('+1 ' + ITEMS[it.type].n);
    }
  }
  if (S.q.bridge === 1) {
    PLANK_SPOTS.forEach((p, i) => {
      if (!S.plankGot[i] && dist(L, { x: p[0], y: p[1] }) < 32) {
        S.plankGot[i] = true; S.planks++;
        save(); updateWorldHud(); Sound.play('pick');
        toast('מצאת קרש! ' + S.planks + ' מתוך 3');
      }
    });
  }

  // Fishing: wait, then a bite, and the player has a moment to pull
  const f = w.fishing;
  if (f && --f.timer <= 0) {
    if (f.phase === 'wait') { f.phase = 'bite'; f.timer = 80; Sound.play('spark'); toast('משהו נוגס! למשוך עכשיו! 🎣'); }
    else { w.fishing = null; toast('הדג ברח... אפשר לנסות שוב.'); }
  }

  // What can Luna do right here?
  let best = null, bd = 1e9;
  interactables().forEach(a => {
    const d = dist(L, a);
    if (d < a.r && d < bd) { best = a; bd = d; }
  });
  w.act = w.fishing ? { label: '🎣 למשוך!' } : best;
  const label = w.act ? w.act.label : '';
  if (label !== w.actLabel) {
    w.actLabel = label;
    $('actBtn').hidden = !label;
    $('actBtn').textContent = label;
  }
}

/* ---------- Drawing the world ---------- */
function friendMark(key) {
  const q = S.q;
  if (key === 'noni') return q.scarf === 0 || (q.scarf === 1 && S.scarfFound);
  if (key === 'dobi') return q.fish === 0 || (q.fish === 1 && S.inv.fish >= 2);
  if (key === 'bobo') return q.bridge === 0;
  return q.potion === 0 || (q.potion === 1 && S.inv.potion >= 1);
}

function drawWorld() {
  const w = WR, c = wctx, t = w.t, L = w.luna;
  c.save();
  c.translate(-w.cam.x, -w.cam.y);
  Art.worldGround(c, w.cam.x, w.cam.y, 800, 500, t);

  // water, the dock and the bridge
  Art.lake(c, LAKE.x, LAKE.y, LAKE.rx, LAKE.ry, t);
  Art.waterRect(c, STREAM.x0, STREAM.y0, STREAM.x1 + 5, STREAM.y1, t);
  Art.waterRect(c, RIVER.x0, -10, RIVER.x1, WH + 10, t);
  Art.dock(c, DOCK.x, DOCK.y - 4);
  Art.bridge(c, RIVER.x0 - 15, RIVER.x1 + 15, BRIDGE.y0, BRIDGE.y1, S.bridge);

  // hidden spots glitter
  if (S.q.scarf === 1 && !S.scarfFound) {
    Art.ell(c, SCARF_SPOT.x, SCARF_SPOT.y - 3, 11, 4, '#e8394d');
    Art.sparkle(c, SCARF_SPOT.x, SCARF_SPOT.y, t);
  }
  if (S.q.potion === 2 && !S.digFound) Art.sparkle(c, DIG_SPOT.x, DIG_SPOT.y, t);

  // everything that stands up, drawn from back to front
  const things = [];
  HOUSES.forEach(h => things.push({ y: h.y, draw: () => Art.house(c, h.x, h.y, h.s, h.roof, h.shop, t) }));
  w.trees.forEach(tr => things.push({ y: tr.y, draw: () => Art.tree(c, tr.x, tr.y, tr.s, t, tr.seed, tr.kind) }));
  for (const key in FRIENDS) {
    const f = FRIENDS[key];
    things.push({ y: f.y, draw: () => {
      Art.animal(c, f.kind, f.x, f.y, 0.6, t);
      if (friendMark(key)) {
        const by = f.y - 92 + Math.sin(t * 0.1) * 3;
        Art.ell(c, f.x, by, 11, 11, '#ffd84d');
        c.fillStyle = '#4a3b47'; c.font = 'bold 16px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('!', f.x, by + 1);
      }
    } });
  }
  things.push({ y: L.y, draw: () => Art.cat(c, L.x, L.y, 0.95, { dir: w.dir, t: t, walking: w.moving }) });
  things.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // things to pick up are on top, so trees never hide them
  w.items.forEach(it => Art[it.type](c, it.x, it.y, 1.2, t, it.seed));
  if (S.q.bridge === 1) PLANK_SPOTS.forEach((p, i) => { if (!S.plankGot[i]) { Art.plank(c, p[0], p[1], 1.3); Art.sparkle(c, p[0], p[1] - 6, t + i * 9); } });

  if (w.target) {
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2;
    c.beginPath(); c.arc(w.target.x, w.target.y, 8 + Math.sin(t * 0.2) * 2, 0, Math.PI * 2); c.stroke();
  }

  // the fishing line
  if (w.fishing) {
    const bite = w.fishing.phase === 'bite';
    const by = BOBBER.y + (bite ? 5 + Math.sin(t * 0.8) * 2 : Math.sin(t * 0.1) * 1.5);
    c.strokeStyle = 'rgba(60,60,60,0.8)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(L.x + 14, L.y - 42); c.quadraticCurveTo(L.x + 10, BOBBER.y - 30, BOBBER.x, by); c.stroke();
    Art.ell(c, BOBBER.x, by, 5, 5, '#fff'); Art.ell(c, BOBBER.x, by - 2, 5, 3, '#e8394d');
    if (bite) {
      c.strokeStyle = 'rgba(255,255,255,0.8)';
      [10, 18].forEach((r, i) => { c.beginPath(); c.ellipse(BOBBER.x, by + 3, r + (t % 20) * 0.4 * (i + 1) * 0.5, (r + (t % 20) * 0.2) * 0.35, 0, 0, Math.PI * 2); c.stroke(); });
      c.fillStyle = '#e8394d'; c.font = 'bold 34px sans-serif'; c.textAlign = 'center';
      c.fillText('!', L.x, L.y - 88 + Math.sin(t * 0.5) * 3);
    }
  }
  c.restore();
}

/* ---------- Night in chapter 2 ---------- */
function chapter2Night() {
  if (shardCount() >= 3 && !S.ch2done) { finishChapter2(); return; }
  const left = Math.max(2, 14 - (S.day - 5) * 3);
  const text = S.ch2done
    ? 'הלילה יורד על הכפר הקטן. בשמיים מנצנצים כוכבים יפים, ולונה נרדמת עם חיוך.'
    : 'הלילה יורד על הכפר הקטן. לונה מציצה מהחלון: בשמיים נשארו רק ' + left + ' כוכבים... ' +
      (shardCount() ? 'שברי הכוכבים שלה מנצנצים בכיס. ' : '') + 'היא נרדמת ומקווה למצוא עוד מחר.';
  story(text, [{ label: 'בוקר חדש ☀️', fn: startDay }]);
}

function finishChapter2() {
  S.ch2done = true;
  save();
  Sound.play('win');
  story('בלילה, שלושת שברי הכוכב בכיס של לונה מתחילים לזרוח. הם מתחברים אחד לשני, ונהיים כוכב קטן ושלם שרוחש בידיים שלה.',
    [{ label: 'לונה מרימה אותו אל השמיים', fn: () => {
      story('הכוכב עולה אל השמיים ומאיר! אבל בעומק האגם לונה רואה צל גדול זז במים... ובכפר, מישהו חדש ומסתורי כבר מתקרב בשקט אל הדלת של החנות.',
        [{ label: 'סוף פרק 2 💛', fn: () => {
          story('פרק 3 בדרך: הכפר הגדול והאורח המסתורי. בינתיים אפשר להמשיך לטייל, לדוג, לעזור לחברים ולהשלים את אלבום האוצרות.',
            [{ label: 'להמשיך לשחק', fn: startDay }]);
        } }]);
    } }]);
}
