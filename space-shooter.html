<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מגן החלל</title>
<style>
  body { margin: 0; background: #05060f; color: #fff; font-family: Arial, sans-serif; text-align: center; }
  h1 { margin: 10px 0 4px; font-size: 24px; }
  canvas { background: #05060f; border: 3px solid #4a5cff; max-width: 98vw; cursor: none; touch-action: none; }
  p { max-width: 700px; margin: 6px auto; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<h1>מגן החלל 🚀</h1>
<canvas id="game" width="600" height="700"></canvas>
<p>הזיזו את הספינה עם העכבר (או החיצים). היא יורה לבד. הגנו על כדור הארץ, אספו בונוסים ✨ ושרדו כמה שיותר זמן! לחצו על המסך כדי להתחיל.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;

let ship, bullets, enemies, shots, particles, powerups, bgStars = [];
let score, lives, level, frame, state = 'start', best = Number(localStorage.getItem('spaceBest') || 0);
let target = { x: CW / 2 }, keys = {};

for (let i = 0; i < 80; i++) bgStars.push({ x: Math.random() * CW, y: Math.random() * CH, s: 0.5 + Math.random() * 2 });

function newGame() {
  ship = { x: CW / 2, y: CH - 70, w: 36, h: 40, fireDelay: 0, power: 1, powerTime: 0, shield: 0, hurt: 0 };
  bullets = []; enemies = []; shots = []; particles = []; powerups = [];
  score = 0; lives = 3; level = 1; frame = 0; state = 'play';
}

function boom(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30 + Math.random() * 20, color });
  }
}

function spawnEnemy() {
  const kind = Math.random() < 0.2 + level * 0.04 ? 'shooter' : 'drone';
  enemies.push({
    x: 30 + Math.random() * (CW - 60), y: -30, w: 34, h: 30, kind,
    hp: kind === 'shooter' ? 3 : 1, vx: (Math.random() - 0.5) * 2,
    vy: 1 + Math.random() * 0.8 + level * 0.15, t: Math.random() * 100
  });
}

function update() {
  frame++;
  for (const s of bgStars) { s.y += s.s; if (s.y > CH) { s.y = 0; s.x = Math.random() * CW; } }
  if (state !== 'play') return;

  // תנועת הספינה (עכבר או חיצים)
  if (keys.ArrowLeft || keys.a) target.x -= 8;
  if (keys.ArrowRight || keys.d) target.x += 8;
  target.x = Math.max(20, Math.min(CW - 20, target.x));
  ship.x += (target.x - ship.x) * 0.3;
  if (ship.hurt > 0) ship.hurt--;
  if (ship.shield > 0) ship.shield--;
  if (ship.powerTime > 0 && --ship.powerTime === 0) ship.power = 1;

  // ירי אוטומטי
  if (--ship.fireDelay <= 0) {
    ship.fireDelay = 12;
    const offs = ship.power === 1 ? [0] : ship.power === 2 ? [-8, 8] : [-12, 0, 12];
    for (const o of offs) bullets.push({ x: ship.x + o, y: ship.y - 20, vx: o / 12, vy: -10 });
  }

  level = 1 + Math.floor(score / 300);
  if (frame % Math.max(18, 60 - level * 5) === 0) spawnEnemy();

  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20);

  for (const e of enemies) {
    e.t++; e.y += e.vy; e.x += e.vx + Math.sin(e.t * 0.05) * 1.2;
    e.x = Math.max(20, Math.min(CW - 20, e.x));
    if (e.kind === 'shooter' && e.t % 90 === 0) shots.push({ x: e.x, y: e.y + 15, vy: 4 + level * 0.2 });
  }
  for (const s of shots) s.y += s.vy;
  shots = shots.filter(s => s.y < CH + 20);

  // פגיעות של כדורים באויבים
  for (const e of enemies) for (const b of bullets) {
    if (!b.dead && Math.abs(b.x - e.x) < e.w / 2 + 3 && Math.abs(b.y - e.y) < e.h / 2 + 6) {
      b.dead = true; e.hp--; boom(b.x, b.y, '#ffe066', 3);
      if (e.hp <= 0) {
        e.dead = true; score += e.kind === 'shooter' ? 30 : 10;
        boom(e.x, e.y, e.kind === 'shooter' ? '#ff6b6b' : '#6bff9e', 18);
        if (Math.random() < 0.12) powerups.push({ x: e.x, y: e.y, type: ['power', 'shield', 'life'][Math.floor(Math.random() * 3)] });
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // פגיעה בשחקן
  const hit = (x, y, r) => Math.abs(x - ship.x) < r + ship.w / 2 - 6 && Math.abs(y - ship.y) < r + ship.h / 2 - 6;
  for (const e of enemies) if (hit(e.x, e.y, 15)) { e.dead = true; boom(e.x, e.y, '#ff9f43'); damage(); }
  for (const s of shots) if (hit(s.x, s.y, 4)) { s.y = CH + 99; damage(); }
  for (const e of enemies) if (e.y > CH + 20) { e.dead = true; damage(true); }  // אויב שהגיע לכדור הארץ
  enemies = enemies.filter(e => !e.dead);

  // בונוסים
  for (const p of powerups) {
    p.y += 2;
    if (hit(p.x, p.y, 12)) {
      p.dead = true; score += 5;
      if (p.type === 'power') { ship.power = Math.min(3, ship.power + 1); ship.powerTime = 600; }
      if (p.type === 'shield') ship.shield = 360;
      if (p.type === 'life') lives = Math.min(5, lives + 1);
    }
  }
  powerups = powerups.filter(p => !p.dead && p.y < CH + 20);

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function damage(planet) {
  if (!planet && (ship.shield > 0 || ship.hurt > 0)) return;
  lives--; ship.hurt = 90; boom(ship.x, ship.y, '#fff', 20);
  if (lives <= 0) { state = 'over'; if (score > best) { best = score; try { localStorage.setItem('spaceBest', best); } catch (e) {} } }
}

function draw() {
  ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = '#fff';
  for (const s of bgStars) ctx.fillRect(s.x, s.y, s.s, s.s);

  if (state !== 'start') {
    for (const p of powerups) {
      ctx.fillStyle = { power: '#ffd93b', shield: '#4dd0ff', life: '#ff6b9d' }[p.type];
      ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
      ctx.fillText({ power: '⚡', shield: '◎', life: '♥' }[p.type], p.x, p.y + 5);
    }
    ctx.fillStyle = '#ffe066';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    ctx.fillStyle = '#ff5252';
    for (const s of shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill(); }

    for (const e of enemies) {
      ctx.fillStyle = e.kind === 'shooter' ? '#e63946' : '#2ecc71';
      ctx.beginPath(); ctx.moveTo(e.x - 17, e.y - 12); ctx.lineTo(e.x + 17, e.y - 12);
      ctx.lineTo(e.x, e.y + 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(e.x - 8, e.y - 7, 5, 5); ctx.fillRect(e.x + 3, e.y - 7, 5, 5);
    }

    if (state === 'play' && !(ship.hurt > 0 && Math.floor(ship.hurt / 5) % 2)) {
      ctx.fillStyle = '#ff9f1c'; ctx.beginPath();                                   // להבה
      ctx.moveTo(ship.x - 7, ship.y + 18); ctx.lineTo(ship.x, ship.y + 28 + Math.random() * 8); ctx.lineTo(ship.x + 7, ship.y + 18); ctx.fill();
      ctx.fillStyle = '#4a5cff'; ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 22); ctx.lineTo(ship.x + 20, ship.y + 20); ctx.lineTo(ship.x - 20, ship.y + 20); ctx.fill();
      ctx.fillStyle = '#bde0ff'; ctx.beginPath(); ctx.arc(ship.x, ship.y, 6, 0, 7); ctx.fill();
      if (ship.shield > 0) { ctx.strokeStyle = '#4dd0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ship.x, ship.y, 32, 0, 7); ctx.stroke(); }
    }
    for (const p of particles) { ctx.globalAlpha = p.life / 50; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#2a7d46'; ctx.fillRect(0, CH - 6, CW, 6);                      // כדור הארץ
    ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.textAlign = 'right';
    ctx.fillText('ניקוד: ' + score, CW - 12, 26);
    ctx.fillText('שלב: ' + level, CW - 12, 50);
    ctx.textAlign = 'left'; ctx.fillStyle = '#ff6b9d';
    ctx.fillText('♥'.repeat(lives), 12, 26);
  }

  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  if (state === 'start') {
    ctx.font = 'bold 44px Arial'; ctx.fillText('מגן החלל', CW / 2, 280);
    ctx.font = '22px Arial'; ctx.fillText('לחצו כדי להתחיל', CW / 2, 330);
    if (best) ctx.fillText('שיא: ' + best, CW / 2, 370);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, CW, CH); ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px Arial'; ctx.fillText('המשחק נגמר', CW / 2, 280);
    ctx.font = '24px Arial'; ctx.fillText('ניקוד: ' + score + '   שיא: ' + best, CW / 2, 330);
    ctx.fillText('לחצו כדי לשחק שוב', CW / 2, 380);
  }
}

function pointer(e) {
  const r = canvas.getBoundingClientRect();
  target.x = (e.clientX - r.left) * CW / r.width;
}
canvas.addEventListener('mousemove', pointer);
canvas.addEventListener('touchmove', e => { pointer(e.touches[0]); e.preventDefault(); }, { passive: false });
canvas.addEventListener('mousedown', e => { pointer(e); if (state !== 'play') newGame(); });
canvas.addEventListener('touchstart', e => { pointer(e.touches[0]); if (state !== 'play') newGame(); });
addEventListener('keydown', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') newGame();
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
