<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>משחק פנדה</title>

<style>
    body{
        margin:0;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#222;
        overflow:hidden;
    }

    canvas{
        background:white;
        border:4px solid black;
    }
</style>
</head>
<body>

<canvas id="game" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;

// תמונת הפנדה
const panda = new Image();
panda.src = "panda.png";

// זווית סיבוב
let angle = 0;

const ball = {
    x: 250,
    y: 250,
    size: 70,
    dx: 4,
    dy: 3
};

// משולשים גדולים יותר
const triangleSize = 70;

// אבק זהב
const sparkles = [];

// שומר באיזו פינה הכדור נמצא
let currentTriangle = "";

// המלבן של השחקן
const paddle = {
    width: 100,
    height: 15,
    x: 200,
    y: 470,
    speed: 7
};

// שליטה
let rightPressed = false;
let leftPressed = false;

document.addEventListener("keydown", (e)=>{

    if(e.key === "ArrowRight"){
        rightPressed = true;
    }

    if(e.key === "ArrowLeft"){
        leftPressed = true;
    }
});

document.addEventListener("keyup", (e)=>{

    if(e.key === "ArrowRight"){
        rightPressed = false;
    }

    if(e.key === "ArrowLeft"){
        leftPressed = false;
    }
});

// יצירת אבק זהב
function createSparkles(){

    for(let i = 0; i < 18; i++){

        sparkles.push({

            x: ball.x,
            y: ball.y,

            size: Math.random() * 3 + 1,

            dx: (Math.random() - 0.5) * 2,
            dy: (Math.random() - 0.5) * 2,

            life: 1
        });
    }
}

// ציור אבק זהב
function drawSparkles(){

    for(let i = sparkles.length - 1; i >= 0; i--){

        const s = sparkles[i];

        s.x += s.dx;
        s.y += s.dy;

        // האטה עדינה בשביל אפקט אבק
        s.dx *= 0.97;
        s.dy *= 0.97;

        // התפוגגות מהירה
        s.life -= 0.03;

        ctx.save();

        ctx.globalAlpha = s.life * 0.7;

        // צבע אבק זהב רך
        ctx.fillStyle = "#d4af37";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

        // מוחק חלקיקים שנעלמו
        if(s.life <= 0){

            sparkles.splice(i,1);
        }
    }
}

// ציור הפנדה
function drawPanda(){

    // שינוי זווית
    angle += 0.05;

    ctx.save();

    // מעבר למרכז הפנדה
    ctx.translate(ball.x, ball.y);

    // סיבוב
    ctx.rotate(angle);

    // יצירת עיגול
    ctx.beginPath();

    ctx.arc(
        0,
        0,
        ball.size / 2,
        0,
        Math.PI * 2
    );

    // חותך לעיגול
    ctx.clip();

    // ציור התמונה במרכז
    ctx.drawImage(
        panda,
        -ball.size / 2,
        -ball.size / 2,
        ball.size,
        ball.size
    );

    ctx.restore();
}

// ציור המלבן
function drawPaddle(){

    ctx.fillStyle = "turquoise";

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

// ציור משולשים צבעוניים
function drawTriangles(){

    // שמאל למעלה - ורוד
    ctx.fillStyle = "#ff4fd8";

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(triangleSize,0);
    ctx.lineTo(0,triangleSize);
    ctx.fill();

    // ימין למעלה - תכלת
    ctx.fillStyle = "#66e6ff";

    ctx.beginPath();
    ctx.moveTo(canvas.width,0);
    ctx.lineTo(canvas.width-triangleSize,0);
    ctx.lineTo(canvas.width,triangleSize);
    ctx.fill();

    // שמאל למטה - כחול
    ctx.fillStyle = "#2f6fff";

    ctx.beginPath();
    ctx.moveTo(0,canvas.height);
    ctx.lineTo(triangleSize,canvas.height);
    ctx.lineTo(0,canvas.height-triangleSize);
    ctx.fill();

    // ימין למטה - כסף נוצץ
    const silverGradient = ctx.createLinearGradient(
        canvas.width - triangleSize,
        canvas.height - triangleSize,
        canvas.width,
        canvas.height
    );

    silverGradient.addColorStop(0, "#ffffff");
    silverGradient.addColorStop(0.25, "#d9d9d9");
    silverGradient.addColorStop(0.5, "#ffffff");
    silverGradient.addColorStop(0.75, "#bfbfbf");
    silverGradient.addColorStop(1, "#f5f5f5");

    ctx.fillStyle = silverGradient;

    ctx.beginPath();
    ctx.moveTo(canvas.width,canvas.height);
    ctx.lineTo(canvas.width-triangleSize,canvas.height);
    ctx.lineTo(canvas.width,canvas.height-triangleSize);
    ctx.fill();
}

// פגיעה במשולשים
function checkTriangleHit(){

    let triangle = "";

    // שמאל למעלה
    if(
        ball.x < triangleSize &&
        ball.y < triangleSize
    ){
        triangle = "topLeft";
    }

    // ימין למעלה
    else if(
        ball.x > canvas.width - triangleSize &&
        ball.y < triangleSize
    ){
        triangle = "topRight";
    }

    // שמאל למטה
    else if(
        ball.x < triangleSize &&
        ball.y > canvas.height - triangleSize
    ){
        triangle = "bottomLeft";
    }

    // ימין למטה
    else if(
        ball.x > canvas.width - triangleSize &&
        ball.y > canvas.height - triangleSize
    ){
        triangle = "bottomRight";
    }

    // מוסיף נקודות רק כשנכנסים לפינה חדשה
    if(
        triangle !== "" &&
        triangle !== currentTriangle
    ){
        score += 3;
    }

    currentTriangle = triangle;
}

// פגיעה במלבן
function checkPaddleHit(){

    if(
        ball.y + ball.size/2 >= paddle.y &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width &&
        ball.dy > 0
    ){

        ball.dy *= -1;

        score += 1;

        createSparkles();
    }
}

// ציור ניקוד
function drawScore(){

    ctx.fillStyle = "black";

    ctx.font = "24px Arial";

    ctx.fillText(
        "Score: " + score,
        15,
        30
    );
}

// הזזת המלבן
function movePaddle(){

    if(
        rightPressed &&
        paddle.x + paddle.width < canvas.width
    ){
        paddle.x += paddle.speed;
    }

    if(
        leftPressed &&
        paddle.x > 0
    ){
        paddle.x -= paddle.speed;
    }
}

function update(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    movePaddle();

    // הזזת הפנדה
    ball.x += ball.dx;
    ball.y += ball.dy;

    // קירות צד
    if(
        ball.x + ball.size/2 >= canvas.width ||
        ball.x - ball.size/2 <= 0
    ){
        ball.dx *= -1;

        createSparkles();
    }

    // קיר עליון
    if(
        ball.y - ball.size/2 <= 0
    ){
        ball.dy *= -1;

        createSparkles();
    }

    // תחתית
    if(
        ball.y + ball.size/2 >= canvas.height
    ){
        ball.dy *= -1;

        createSparkles();
    }

    checkTriangleHit();

    checkPaddleHit();

    drawTriangles();

    drawPaddle();

    drawSparkles();

    drawPanda();

    drawScore();

    requestAnimationFrame(update);
}

// מתחיל רק כשהתמונה נטענה
panda.onload = function(){

    update();
};
</script>

</body>
</html>
