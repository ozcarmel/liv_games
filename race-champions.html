<style>
:root{--ink:#1d1b4b;--paper:#fff;--sun:#ffd23f;--pink:#ff5fa2;--grape:#7a5cff;--mint:#2fd1a0;--sky:#6fd3ff;
  --display:"Secular One","Arial Rounded MT Bold",Arial,sans-serif;--body:"Rubik",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:500;
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:#ffcc22;border:2px solid #a86f00;box-shadow:inset 0 0 0 2px #ffe680;vertical-align:-.1em}
button{font-family:var(--display);font-size:1.1rem;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:8px 18px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
.big{font-size:1.5rem;padding:12px 22px;width:100%}
.sun{background:var(--sun)}.pink{background:var(--pink)}.mint{background:var(--mint)}.grape{background:var(--grape);color:#fff}

/* תפריט */
#menu{position:fixed;top:0;bottom:0;right:0;width:min(440px,48vw);padding:14px;display:flex;flex-direction:column;gap:10px;z-index:5}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:5px 16px;font-family:var(--display);font-size:1.25rem;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
#back{font-family:var(--display);font-size:1.1rem;color:var(--ink);text-decoration:none;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 16px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
#panel{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;background:rgba(255,255,255,.93);border:4px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:16px}
h1{font-family:var(--display);font-weight:400;font-size:2.5rem;margin:0 0 4px;text-align:center;line-height:1.1}
h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0}
.sub{text-align:center;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.item{border:3px solid var(--ink);border-radius:18px;padding:10px 12px;background:var(--paper);display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.item.on{background:#fff4c2}
.item.locked{opacity:.65}
.item h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.item p{margin:2px 0 0;font-size:.9rem}
.item button{flex:none;font-size:1rem;padding:6px 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{font-size:.95rem;padding:5px 12px}
.tabs button.on{background:var(--grape);color:#fff}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.78rem;margin-top:6px;align-items:center}
.bar{display:block;height:9px;width:120px;max-width:100%;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:var(--mint)}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);flex:none}
.help{font-size:.85rem;text-align:center;margin:14px 0 0;line-height:1.6}
.credit{direction:ltr;font-size:.7rem;text-align:center;margin:12px 0 0;opacity:.8}
.credit a{color:inherit}

/* מסך מרוץ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
.box{background:rgba(255,255,255,.9);border:3px solid var(--ink);border-radius:16px;padding:5px 12px;font-family:var(--display);box-shadow:3px 3px 0 var(--ink)}
#stats{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;font-size:1.05rem}
#hPos{font-size:1.9rem;background:var(--sun)}
#hGoal{max-width:min(330px,60vw);font-size:.95rem;background:#e8e0ff}
#mapwrap{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#map{width:140px;height:140px;background:rgba(255,255,255,.8);border:3px solid var(--ink);border-radius:18px}
#pauseBtn{pointer-events:auto}
#speedo{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;min-width:170px}

#big{position:absolute;top:34%;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(3rem,13vw,7rem);color:var(--sun);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink)}
#toast{position:absolute;top:58%;left:0;right:0;padding:0 16px;text-align:center;font-family:var(--display);font-size:clamp(1.1rem,3.4vw,1.7rem);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transition:opacity .25s;opacity:0}
#touch{position:absolute;inset:0;direction:ltr}
.pad{position:absolute;pointer-events:auto;width:76px;height:76px;border-radius:50%;padding:0;font-size:2rem;background:rgba(255,255,255,.85);touch-action:none}
.pad.down{background:var(--sun);transform:translate(2px,2px)}
#tL{left:16px;bottom:22px}#tR{left:108px;bottom:22px}
#tN{right:16px;bottom:22px;background:var(--pink);font-size:1.1rem}
#tB{right:108px;bottom:22px;font-size:1rem}
@media (pointer:coarse){#speedo{bottom:112px}}

.overlay{position:fixed;inset:0;background:rgba(29,27,75,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:20px;width:min(420px,100%);max-height:100%;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:12px;text-align:center}
.dialog table{width:100%;border-collapse:collapse}
.dialog td{padding:3px 6px;border-bottom:2px dashed #cfcbe8}
.dialog tr.me{background:#fff4c2;font-weight:700}
.stars{font-size:2.4rem;letter-spacing:6px}

@media (max-aspect-ratio:1/1){
  #menu{top:auto;left:0;width:auto;height:62%;padding:10px}
  h1{font-size:2rem}
  #map{width:96px;height:96px}
}
@media (max-height:500px){h1{font-size:1.7rem}.sub{margin-bottom:8px}.big{font-size:1.15rem;padding:7px}#map{width:92px;height:92px}.help{display:none}
  /* טלפון לרוחב: מד המהירות יורד לתחתית כדי לא להסתיר את המכונית */
  #speedo{bottom:8px;min-width:130px;padding:2px 10px}#speedo b{font-size:1.5rem}#speedo small:last-child{display:none}
  #stats{gap:5px;font-size:.9rem}#hPos{font-size:1.3rem}}
</style>
</head>

const COLORS = [
  { id:'red',    name:'אדום',   hex:0xff3b4e, price:0 },
  { id:'blue',   name:'כחול',   hex:0x2f7bff, price:0 },
  { id:'green',  name:'ירוק',   hex:0x23c46b, price:80 },
  { id:'yellow', name:'צהוב',   hex:0xffd23f, price:80 },
  { id:'pink',   name:'ורוד',   hex:0xff5fa2, price:120 },
  { id:'purple', name:'סגול',   hex:0x8a4dff, price:120 },

  { id:'gold',   name:'זהב',    hex:0xe8b21c, price:900, metal:true },
  { id:'rainbow',name:'קשת',    hex:0xff0000, price:1500, rainbow:true }
];
const UPGRADES = [
  { id:'engine', name:'מנוע',    desc:'מהירות גבוהה יותר', icon:'⚙️' },
  { id:'tires',  name:'צמיגים',  desc:'פניות חדות יותר',   icon:'🏎️' },
  { id:'turbo',  name:'טורבו',   desc:'ניטרו חזק וארוך',   icon:'🔥' }
];
const UP_PRICE = [150, 350, 700];
const EXTRAS = [
  { id:'none',    name:'בלי קישוט',   price:0,   icon:'➖' },
  { id:'spoiler', name:'כנף מרוצים',  price:150, icon:'🏁' },

  { id:'ears',    name:'אוזני חתול',  price:250, icon:'🐱' },
  { id:'balloon', name:'בלונים',      price:300, icon:'🎈' },
  { id:'crown',   name:'כתר',         price:800, icon:'👑' }
];
const TRAILS = [
  { id:'smoke',   name:'עשן',          price:0,   colors:[0xdddddd] },
  { id:'fire',    name:'אש',           price:220, colors:[0xff3b00,0xff9a00,0xffe14a] },
  { id:'bubbles', name:'בועות',        price:260, colors:[0x9be8ff,0xffffff] },
  { id:'hearts',  name:'ניצוצות ורודים',price:300, colors:[0xff5fa2,0xffa8cc] },
  { id:'rain',    name:'קשת בענן',     price:600, colors:[0xff3b4e,0xff9a00,0xffe14a,0x23c46b,0x2f7bff,0x8a4dff] }
];
const TRACKS = [
  { id:'park',  name:'הפארק הירוק',   icon:'🌳', sky:0x8fd8ff, ground:0x5cbf55, road:'#55555f', deco:'tree',
    radii:[150,160,150,125,120,140,165,160,135,125,130,140], sx:1.15, sz:1, ai:[33,39], cones:6,  oil:2, prize:1 },
  { id:'desert',name:'מדבר הקקטוסים', icon:'🌵', sky:0xffd9a0, ground:0xe5b565, road:'#6b5a50', deco:'cactus',
    radii:[170,140,115,145,180,150,115,120,165,175,130,125,160,170], sx:1.1, sz:1, ai:[38,45], cones:9,  oil:4, prize:1.4 },
  { id:'snow',  name:'פסגת השלג',     icon:'⛄', sky:0xc4dcf2, ground:0xf2f7ff, road:'#5c6675', deco:'pine',
    radii:[160,185,140,110,150,190,155,120,115,160,185,145,115,135], sx:1.2, sz:.95, ai:[43,51], cones:10, oil:7, prize:1.8, slip:.82 },
  { id:'night', name:'עיר בלילה',     icon:'🌃', sky:0x141238, ground:0x24243e, road:'#2c2c3a', deco:'building',
    radii:[180,150,115,120,175,195,140,110,160,190,150,115,125,185,170,135], sx:1.2, sz:1, ai:[48,57], cones:12, oil:7, prize:2.4, night:true }
];
const CHALLENGES = [

  { id:'clock',  name:'נגד השעון',       desc:'הקפה אחת בפארק בפחות מ-{t} שניות', track:0, laps:1, rivals:0, goal:'time', pace:.92, reward:180 },
  { id:'clean',  name:'נהיגה זהירה',     desc:'2 הקפות בלי לפגוע בקונוס או בשמן', track:1, laps:2, rivals:0, goal:'clean', cones:22, oil:8, reward:250 },
  { id:'pads',   name:'מלכי הזינוק',     desc:'לעלות על 8 משטחי טורבו ב-2 הקפות', track:1, laps:2, rivals:3, goal:'pads', n:8, reward:250 },
  { id:'nonitro',name:'בלי ניטרו',       desc:'להגיע למקום 1 עד 3 בלי להשתמש בניטרו', track:0, laps:3, rivals:5, goal:'nonitro', reward:300 },
  { id:'duel',   name:'דו-קרב עם ברק',   desc:'לנצח את האלוף ברק, אחד על אחד', track:2, laps:2, rivals:1, goal:'win', boost:1.06, reward:450 },

  { id:'king',   name:'אלוף האלופים',    desc:'לנצח בעיר בלילה', track:3, laps:3, rivals:5, goal:'win', reward:900 }
];
const RIVAL_NAMES = ['ברק','נועה','טורבו-טל','זיקית','סופה'];

/* ───────── שמירה ───────── */
const SAVE_KEY = 'raceChampions1';
let S = { coins:100, car:'starter', color:'red', extra:'none', trail:'smoke', cam:0,
  owned:{ 'car:starter':1, 'color:red':1,'color:blue':1, 'extra:none':1, 'trail:smoke':1 },
  up:{ engine:0, tires:0, turbo:0 }, unlocked:1, best:{}, done:{}, mute:false, assist:true };
try {
  const r = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (r && typeof r === 'object') S = Object.assign(S, r);
} catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} };
// שמירה ישנה, פעם אחת: כולם עוברים למכונית ההתחלה. הקטנטנה ומכונית השרירים חולקו בחינם
// ולכן חוזרות לחנות. מכוניות שנקנו במטבעות נשארות.
if (!S.owned['car:starter']) { delete S.owned['car:gt']; delete S.owned['car:mini']; S.owned['car:starter'] = 1; S.car = 'starter'; save(); }
const byId = (list, id) => list.find(x => x.id === id) || list[0];

function carStats() {
  const c = byId(CARS, S.car);
  return { speed: c.speed + S.up.engine * 3, accel: c.accel + S.up.engine * 2, grip: c.grip + S.up.tires * .13,
           nitroPow: 1.38 + S.up.turbo * .05, nitroDrain: .32 - S.up.turbo * .06, car: c.id };
}

/* ───────── צלילים ───────── */
const sfx = {
  ctx:null, osc:null, gain:null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.osc = this.ctx.createOscillator(); this.osc.type = 'sawtooth';
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    this.gain = this.ctx.createGain(); this.gain.gain.value = 0;
    this.osc.connect(f); f.connect(this.gain); this.gain.connect(this.ctx.destination); this.osc.start();
  },

      sfx.engine(Math.abs(race.me.speed), race.state === 'run', race.nitroOn);
    }
    updateHud();
    renderer.render(race.scene, camera);
  } else {
    showCar.rotation.y += dt * .5;
    animateCar(showCar, 0, 0, dt, clock);
    const a = innerWidth / innerHeight;
    const free = a > 1 ? (innerWidth - $('menu').offsetWidth) / innerHeight : innerWidth / (innerHeight - $('menu').offsetHeight);
    const dist = Math.max(15, 21 / Math.max(.45, free)) * (a > 1 ? 1 : 1.7);
    camera.fov = 40; camera.updateProjectionMatrix();
    camera.position.set(0, dist * .38, dist); camera.lookAt(0, 1.3, 0);
    renderer.render(showroom, camera);
  }
}
refreshShowCar(); show('home'); resize(); requestAnimationFrame(frame);
</script>
</body>
