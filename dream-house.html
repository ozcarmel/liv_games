<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הבית של חלום בחלום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b4b; --sun:#ffd23f; --pink:#ff5fa2; --grape:#7a5cff; --mint:#2fd1a0;
    --display:"Secular One","Arial Rounded MT Bold",Arial,sans-serif; --body:"Rubik",Arial,sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; direction:rtl; font-family:var(--body); color:#fff; font-size:17px;
    background: radial-gradient(rgba(255,255,255,.5) 2px, transparent 2.5px) 0 0 / 61px 61px, linear-gradient(180deg,#2a1d6b,#140f3a);
    padding:12px max(14px, env(safe-area-inset-right)) 24px max(14px, env(safe-area-inset-left)); }
  .app { max-width: 900px; margin: 0 auto; }
  h1 { font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,5vw,2.2rem); color:var(--sun); margin:0 0 8px; text-shadow:3px 3px 0 var(--ink); }
  .top { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .pill { background:var(--grape); border:3px solid var(--ink); border-radius:999px; padding:2px 14px; font-weight:700; white-space:nowrap; }
  .pill.clock { background:var(--sun); color:var(--ink); font-family:var(--display); font-size:1.3rem; font-variant-numeric:tabular-nums; }
  .need { display:flex; align-items:center; gap:6px; font-weight:700; font-size:.9rem; }
  .need .t { width:60px; height:12px; border-radius:99px; border:2px solid var(--ink); background:rgba(0,0,0,.4); overflow:hidden; }
  .need .t i { display:block; height:100%; width:0; background:var(--mint); transition:width .2s, background .2s; }
  .tasks { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px; padding:0; list-style:none; }
  .tasks li { background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.3); border-radius:14px; padding:4px 12px; font-weight:700; font-size:.95rem; }
  .tasks li.done { background:var(--mint); color:var(--ink); border-color:var(--ink); text-decoration:line-through; }
  .tasks li.next { border-color:var(--sun); box-shadow:0 0 0 2px var(--sun); }
  .stagewrap { position:relative; }
  canvas { display:block; width:100%; height:auto; aspect-ratio:8/5; border:4px solid var(--ink); border-radius:22px; box-shadow:7px 7px 0 var(--grape); touch-action:none; background:#0e1a2b; }
  .toast { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(20,15,58,.92); border:3px solid var(--sun); border-radius:16px; padding:6px 16px; font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; max-width:90%; }
  .toast.on { opacity:1; }
  .actrow { text-align:center; margin-top:14px; min-height:56px; }
  .btn { font-family:var(--display); font-size:1.3rem; color:var(--ink); background:var(--sun); border:4px solid var(--ink); border-radius:999px; padding:8px 28px; cursor:pointer; box-shadow:4px 4px 0 var(--ink); }
  .btn:active { transform:translateY(2px); box-shadow:2px 2px 0 var(--ink); }
  .btn:focus-visible { outline:4px solid #fff; outline-offset:3px; }
  .btn.pink { background:var(--pink); }
  .btn.small { font-size:1rem; padding:4px 16px; border-width:3px; box-shadow:3px 3px 0 var(--ink); }
  .hint { text-align:center; margin:10px 0 0; opacity:.85; font-size:.95rem; }
  .end { position:fixed; inset:0; background:rgba(10,5,40,.82); display:none; place-items:center; padding:16px; z-index:10; }
  .end.on { display:grid; }
  .endcard { background:#1d1560; border:4px solid var(--ink); border-radius:26px; box-shadow:8px 8px 0 var(--grape); padding:22px 26px; max-width:460px; width:100%; text-align:center; }
  .endcard h2 { font-family:var(--display); font-weight:400; font-size:2.2rem; color:var(--sun); margin:0 0 8px; }
  .endcard ul { list-style:none; padding:0; margin:12px 0; text-align:start; display:grid; gap:4px; }
  .endcard li { padding:4px 10px; border-radius:10px; background:rgba(255,255,255,.08); }
  .endcard li.ok::before { content:"✓ "; color:var(--mint); font-weight:700; }
  .endcard li.no::before { content:"✗ "; color:#ff7a8a; font-weight:700; }
  .q { font-family:var(--display); font-size:1.6rem; margin:8px 0 14px; }
  .endcard .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <h1>הבית של חלום בחלום</h1>
  <div class="top">
    <span class="pill clock" id="clock" aria-label="שעה">20:00</span>
    <span class="pill" id="roomTxt">מסדרון</span>
    <span class="need">רעב <span class="t"><i id="nHunger"></i></span></span>
    <span class="need">שירותים <span class="t"><i id="nBladder"></i></span></span>
  </div>
  <ul class="tasks" id="tasks" aria-label="משימות"></ul>
  <div class="stagewrap">
    <canvas id="cv" width="800" height="500" aria-label="הבית, מבט מלמעלה"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="actrow"><button class="btn" id="actBtn" type="button" hidden></button></div>
  <p class="hint">חצים או W A S D להליכה. כשעומדים ליד משהו מופיע כפתור: אפשר ללחוץ עליו או על רווח.<br>בטלפון: מחזיקים אצבע על הבית והדמות הולכת אליה.</p>
</div>

<div class="end" id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="endcard">
    <h2 id="endTitle">לילה טוב!</h2>
    <p id="endTime"></p>
    <ul id="endList"></ul>
    <div class="q" id="endQ"></div>
    <div class="row">
      <button class="btn pink" id="dreamBtn" type="button">לחלום!</button>
      <button class="btn small" id="againBtn" type="button">להתחיל ערב מחדש</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var W = 800, H = 500, cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var FONT = '"Secular One","Arial Rounded MT Bold",Arial,sans-serif';
  function $(s) { return document.querySelector(s); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* ================= קלט ================= */
  var keys = {}, actPressed = false;
  addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase(); keys[k] = true;
    if (["arrowleft","arrowright","arrowup","arrowdown"," "].indexOf(k) >= 0 && !$("#end").classList.contains("on")) e.preventDefault();
    if ((k === " " || k === "e" || k === "enter") && !e.repeat && !$("#end").classList.contains("on") && document.activeElement && document.activeElement.tagName !== "BUTTON") actPressed = true;
  });
  addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  addEventListener("blur", function () { keys = {}; });
  var ptr = { x: 0, y: 0, active: false, down: false };
  function setPtr(e) { var r = cv.getBoundingClientRect(); ptr.x = (e.clientX - r.left) / r.width * W; ptr.y = (e.clientY - r.top) / r.height * H; ptr.active = true; }
  cv.addEventListener("pointerdown", function (e) { setPtr(e); ptr.down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
  cv.addEventListener("pointermove", function (e) { if (ptr.down) setPtr(e); });
  cv.addEventListener("pointerup", function () { ptr.down = false; ptr.active = false; });
  cv.addEventListener("pointercancel", function () { ptr.down = false; ptr.active = false; });

  /* ================= ציור: כלים ================= */
  function rr(x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function ell(cx, cy, rx, ry, fill, stroke, lw) {
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function shadow(x, y, w, h, r) { ctx.save(); ctx.globalAlpha = 0.3; rr(x + 3, y + 5, w, h, r || 6, "#000"); ctx.restore(); }
  function vgrad(y0, y1, c0, c1) { var g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
  function hgrad(x0, x1, c0, c1) { var g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
  function txt(s, x, y, size, color) {
    ctx.font = size + "px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.direction = /[֐-׿]/.test(s) ? "rtl" : "ltr";
    ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = "#1d1b4b"; ctx.lineJoin = "round"; ctx.strokeText(s, x, y);
    ctx.fillStyle = color || "#fff"; ctx.fillText(s, x, y);
  }

  /* ================= מבנה הבית ================= */
  var X0 = 40, Y0 = 30, X1 = 760, Y1 = 470, T = 12;
  function R(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
  var WALLS = [
    R(X0 - 6, Y0 - 6, 732, T), R(X0 - 6, Y1 - 6, 526, T), R(640, Y1 - 6, 126, T),
    R(X0 - 6, Y0 - 6, T, 452), R(X1 - 6, Y0 - 6, T, 452),
    R(294, Y0, T, 90), R(294, 190, T, 70),
    R(214, 260, T, 20), R(214, 340, T, 130), R(434, 260, T, 20), R(434, 340, T, 130),
    R(40, 254, 196, T), R(286, 254, 74, T), R(430, 254, 110, T), R(610, 254, 150, T)
  ];
  var STAIRS = R(300, 390, 110, 70), SPAWN = { x: 370, y: 336 };

  var ROOMS = [
    [ // קומה למטה
      { n: "מטבח", r: R(40, 30, 260, 230), k: "tile", a: "#fff4d4", b: "#ffe6a6" },
      { n: "סלון", r: R(300, 30, 460, 230), k: "wood", a: "#dcae78", b: "#cf9f69" },
      { n: "שירותים", r: R(40, 260, 180, 210), k: "tile", a: "#e2f4ff", b: "#c4e8fb" },
      { n: "מסדרון", r: R(220, 260, 220, 210), k: "wood", a: "#c9996a", b: "#bd8c5d" },
      { n: "פינת אוכל", r: R(440, 260, 320, 210), k: "wood", a: "#d9ac7a", b: "#cd9f6e" }
    ],
    [ // קומה למעלה
      { n: "חדר שינה", r: R(40, 30, 260, 230), k: "carpet", a: "#d9ccff", b: "#c6b6fb" },
      { n: "חדר משחקים", r: R(300, 30, 460, 230), k: "carpet", a: "#c9f5e3", b: "#b4ecd2" },
      { n: "מקלחת", r: R(40, 260, 180, 210), k: "tile", a: "#dff2ff", b: "#bfe4f8" },
      { n: "מסדרון", r: R(220, 260, 220, 210), k: "wood", a: "#c9996a", b: "#bd8c5d" },
      { n: "חדר עבודה", r: R(440, 260, 320, 210), k: "wood", a: "#e2c298", b: "#d6b487" }
    ]
  ];
  var WINDOWS = [
    [R(70, Y0 - 6, 70, T), R(180, Y0 - 6, 70, T), R(420, Y0 - 6, 90, T), R(560, Y0 - 6, 90, T), R(X1 - 6, 120, T, 70)],
    [R(90, Y0 - 6, 80, T), R(420, Y0 - 6, 90, T), R(580, Y0 - 6, 90, T), R(X1 - 6, 330, T, 70)]
  ];

  /* ================= ציור רהיטים ================= */
  var DR = {};
  DR.fridge = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    shadow(x, y, w, h, 6);
    rr(x, y, w, h, 6, hgrad(x, x + w, "#f6f9fc", "#cdd6e1"), "#8a96a6", 2);
    rr(x + 4, y + 4, w - 8, h * 0.46, 4, null, "rgba(0,0,0,.12)", 1.5);
    rr(x + w / 2 - 9, y + h - 9, 18, 4, 2, "#6b7685");
    if (on) {
      ctx.save(); var g = ctx.createRadialGradient(x + w / 2, y + h + 14, 2, x + w / 2, y + h + 14, 44); g.addColorStop(0, "rgba(255,247,190,.85)"); g.addColorStop(1, "rgba(255,247,190,0)");
      ctx.fillStyle = g; ctx.fillRect(x - 30, y + h - 6, w + 60, 70); ctx.restore();
      rr(x + w - 6, y + h - 2, 8, w - 4, 3, "#e8edf3", "#8a96a6", 1.5);
    }
  };
  DR.counter = function (it) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    shadow(x, y, w, h, 4); rr(x, y, w, h, 4, "#a56f43", "#6f4727", 2); rr(x + 2, y + 2, w - 4, h - 12, 3, "#f1ebe0");
    ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = 1; for (var i = 1; i < w / 26; i++) { ctx.beginPath(); ctx.moveTo(x + i * 26, y + h - 10); ctx.lineTo(x + i * 26, y + h); ctx.stroke(); }
  };
  DR.stove = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    rr(x, y + 1, w, h - 2, 4, hgrad(x, x + w, "#e5e8ec", "#b9bfc8"), "#6b7480", 1.5);
    [[0.28, 0.32], [0.72, 0.32], [0.28, 0.7], [0.72, 0.7]].forEach(function (p) { ell(x + w * p[0], y + h * p[1], 7, 7, "#2a2d33", "#555b66", 1.5); ell(x + w * p[0], y + h * p[1], 3.5, 3.5, null, "#7b8290", 1); });
  };
  DR.sink = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    shadow(x, y, w, h, 8); rr(x, y, w, h, 8, "#f7fafc", "#9aa6b4", 2);
    ell(x + w / 2, y + h / 2 + 2, w * 0.36, h * 0.32, on ? "#8fd3ff" : "#dbe6ef", "#9aa6b4", 1.5);
    ell(x + w / 2, y + 5, 4, 3, "#8d97a5", "#5e6773", 1);
    if (on) { ctx.strokeStyle = "rgba(120,200,255,.9)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + w / 2, y + 7); ctx.lineTo(x + w / 2, y + h / 2); ctx.stroke(); }
  };
  DR.cabinet = function (it) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    shadow(x, y, w, h, 4); rr(x, y, w, h, 4, "#e8a2c4", "#9b4d73", 2); rr(x + 3, y + 3, w - 6, h - 6, 3, null, "rgba(0,0,0,.2)", 1.5);
    ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.moveTo(x + 4, y + h / 2); ctx.lineTo(x + w - 4, y + h / 2); ctx.stroke();
    rr(x + w - 8, y + h * 0.25, 3, 8, 2, "#ffe08a"); rr(x + w - 8, y + h * 0.7, 3, 8, 2, "#ffe08a");
  };
  DR.table = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h, n = it.chairs || 2, i, cx;
    for (i = 0; i < n; i++) { cx = x + (w * (i + 0.5)) / n; rr(cx - 15, y - 22, 30, 20, 6, "#b6804a", "#7d5430", 2); rr(cx - 15, y + h + 2, 30, 20, 6, "#b6804a", "#7d5430", 2); rr(cx - 12, y - 22, 24, 6, 3, "#9a6a3a"); rr(cx - 12, y + h + 16, 24, 6, 3, "#9a6a3a"); }
    shadow(x, y, w, h, 8); rr(x, y, w, h, 8, vgrad(y, y + h, "#c88f58", "#b57c47"), "#7d5430", 2);
    ctx.strokeStyle = "rgba(90,50,20,.18)"; ctx.lineWidth = 1; for (i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + 6, y + (h * i) / 4); ctx.lineTo(x + w - 6, y + (h * i) / 4); ctx.stroke(); }
    for (i = 0; i < n; i++) { cx = x + (w * (i + 0.5)) / n; ell(cx, y + h / 2, 12, 12, "#fff", "#b9c2cc", 1.5); ell(cx, y + h / 2, 7, 7, null, "#dfe5ea", 1); }
    if (it.bowl) { ell(x + w / 2, y + h / 2, 11, 9, "#fff", "#9aa6b4", 1.5); ell(x + w / 2 - 4, y + h / 2 - 2, 3.5, 3.5, "#ff5a4d"); ell(x + w / 2 + 4, y + h / 2, 3.5, 3.5, "#ffd23f"); ell(x + w / 2, y + h / 2 + 3, 3.5, 3.5, "#7ed957"); }
  };
  DR.sofa = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    shadow(x, y, w, h, 14); rr(x, y, w, h, 14, "#c0453a", "#7d241c", 2.5);
    rr(x + 12, y + 6, w - 24, h - 22, 8, vgrad(y, y + h, "#d65a4d", "#bf4639"), "rgba(0,0,0,.2)", 1.5);
    ctx.strokeStyle = "rgba(0,0,0,.2)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + w / 2, y + 7); ctx.lineTo(x + w / 2, y + h - 17); ctx.stroke();
    rr(x + 2, y + h - 16, w - 4, 14, 8, "#a0352c", "rgba(0,0,0,.25)", 1.5);
    ell(x + w - 24, y + 18, 11, 9, "#ffd23f", "#b88f00", 1.5);
  };
  DR.armchair = function (it) {
    var x = it.x, y = it.y, w = it.w, h = it.h;
    shadow(x, y, w, h, 14); rr(x, y, w, h, 14, "#4a7ec4", "#274c82", 2.5); rr(x + 8, y + 6, w - 16, h - 22, 8, vgrad(y, y + h, "#6b9be0", "#4a7ec4"), "rgba(0,0,0,.2)", 1.5); rr(x + 2, y + h - 14, w - 4, 12, 7, "#3a68a8", "rgba(0,0,0,.25)", 1.5);
  };
  DR.tv = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h, t = Date.now() / 300;
    shadow(x, y, w, h, 4); rr(x, y, w, h, 4, "#5b3b22", "#3a2414", 2);
    rr(x + 8, y + 3, w - 16, h - 12, 3, on ? "#2e5bff" : "#0e0f14", "#000", 2);
    if (on) { for (var i = 0; i < 5; i++) { ctx.fillStyle = "hsla(" + ((t * 30 + i * 60) % 360) + ",90%,60%,.7)"; ctx.fillRect(x + 10 + i * ((w - 20) / 5), y + 5, (w - 20) / 5, h - 16); }
      ctx.save(); var g = ctx.createRadialGradient(x + w / 2, y + h + 20, 4, x + w / 2, y + h + 20, 90); g.addColorStop(0, "rgba(120,160,255,.35)"); g.addColorStop(1, "rgba(120,160,255,0)"); ctx.fillStyle = g; ctx.fillRect(x - 60, y + h, w + 120, 120); ctx.restore(); }
    else { ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.beginPath(); ctx.moveTo(x + 12, y + 4); ctx.lineTo(x + 40, y + 4); ctx.lineTo(x + 22, y + h - 10); ctx.lineTo(x + 12, y + h - 10); ctx.fill(); }
  };
  DR.bookshelf = function (it) {
    var x = it.x, y = it.y, w = it.w, h = it.h, i, cx = x + 5, cols = ["#e0534a", "#3f7fd6", "#f2b630", "#4cb36a", "#8e5bd6", "#e88a3a", "#2fb3b3"];
    shadow(x, y, w, h, 3); rr(x, y, w, h, 3, "#7a4c27", "#4a2d15", 2);
    if (w >= h) { for (i = 0; cx < x + w - 6; i++) { var bw = 4 + ((i * 7) % 4); rr(cx, y + 4, bw, h - 8, 1, cols[i % cols.length]); cx += bw + 1; } }
    else { var cy = y + 5; for (i = 0; cy < y + h - 6; i++) { var bh = 4 + ((i * 7) % 4); rr(x + 4, cy, w - 8, bh, 1, cols[i % cols.length]); cy += bh + 1; } }
  };
  DR.plant = function (it) {
    var cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    shadow(it.x, it.y, it.w, it.h, 12);
    for (var i = 0; i < 7; i++) { var a = (i / 7) * Math.PI * 2; ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ell(it.w * 0.28, 0, it.w * 0.3, it.w * 0.13, i % 2 ? "#3f9a4a" : "#56b45e", "#2c6e35", 1); ctx.restore(); }
    ell(cx, cy, 5, 5, "#8b5a2b", "#5a3a1a", 1);
  };
  DR.toilet = function (it, on) {
    var x = it.x, y = it.y, w = it.w, h = it.h, cx = x + w / 2;
