<style>
  /* קונספט: מגרש משחקים. רקע שמיים עם נקודות, כרטיסים כמו מדבקות עם מסגרת עבה וצל קשיח */
  :root {
    --sky: #6fd3ff;
    --sun: #ffd23f;
    --pink: #ff5fa2;
    --grape: #7a5cff;
    --mint: #2fd1a0;
    --ink: #1d1b4b;
    --paper: #ffffff;
    --display: "Secular One", "Arial Rounded MT Bold", Arial, sans-serif;
    --body: "Rubik", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    direction: rtl;
    background-color: var(--sky);
    background-image: radial-gradient(rgba(255,255,255,.55) 3px, transparent 3.5px);
    background-size: 34px 34px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    padding-block: 0 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* כותרת */
  header { text-align: center; padding: 40px 0 28px; position: relative; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 5rem);
    line-height: 1.1;
    margin: 0 0 12px;
    text-wrap: balance;
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 4px 5px 0 var(--ink);
  }
  h1 span { display: inline-block; }
  h1 span.bounce { animation: hop 2.4s ease-in-out infinite; }
  @keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-14px) rotate(-4deg); } }
  .tagline {
    display: inline-block;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 8px 22px;
    font-weight: 700;
    box-shadow: 4px 4px 0 var(--ink);
    margin: 0;
  }

  /* ציורים צפים ברקע הכותרת */
  .blob { position: absolute; border: 3px solid var(--ink); z-index: 0; }
  .b1 { width: 54px; height: 54px; border-radius: 50%; background: var(--sun); top: 22px; right: 2%; animation: float 5s ease-in-out infinite; }
  .b2 { width: 46px; height: 46px; background: var(--pink); top: 70px; left: 3%; transform: rotate(18deg); border-radius: 10px; animation: float 6s ease-in-out infinite reverse; }
  .b3 { width: 0; height: 0; border: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-bottom: 46px solid var(--grape); top: 6px; left: 18%; animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12px; } }
  header > *:not(.blob) { position: relative; z-index: 1; }

  /* כותרת קטע */
  .section-title {
    font-family: var(--display);
    font-size: 2rem;
    margin: 12px 0 22px;
    display: flex; align-items: center; gap: 12px;
  }
  .count {
    background: var(--sun); border: 3px solid var(--ink); border-radius: 999px;
    font-family: var(--body); font-weight: 700; font-size: 1rem; padding: 2px 14px;
  }

  /* רשת הכרטיסים */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 167px), 1fr)); gap: 22px 18px; padding: 6px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; } }
  .card {
    --c: var(--pink);
    display: flex; flex-direction: column;
    min-width: 0;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 6px 6px 0 var(--c);
    overflow: hidden;
    text-decoration: none; color: inherit;
    transform: rotate(var(--tilt, 0deg));
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:nth-child(4n+1) { --c: var(--pink);  --tilt: -1.6deg; }
  .card:nth-child(4n+2) { --c: var(--grape); --tilt: 1.4deg; }
  .card:nth-child(4n+3) { --c: var(--mint);  --tilt: -1deg; }
  .card:nth-child(4n+4) { --c: var(--sun);   --tilt: 1.8deg; }
  .card:hover, .card:focus-visible { transform: rotate(0deg) translateY(-8px) scale(1.03); box-shadow: 8px 10px 0 var(--c); outline: none; }
  .card:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
  .thumb { border-bottom: 3px solid var(--ink); background: var(--c); }
  .thumb img { display: block; width: 100%; height: auto; aspect-ratio: 400 / 240; object-fit: cover; }
  .info { padding: 9px 12px 11px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .info h3 { font-family: var(--display); font-weight: 400; font-size: 1.05rem; line-height: 1.15; margin: 0; text-wrap: balance; }
  .by { margin: 0; font-size: .8rem; font-weight: 500; opacity: .8; }
  .by b { color: var(--ink); opacity: 1; }
  .play {
    margin-top: 8px; align-self: flex-start;
    background: var(--c); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px;
    font-family: var(--display); font-size: .85rem; padding: 3px 14px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .card:hover .play { animation: wiggle .5s ease; }

  /* שורה תחתונה בכרטיס: כפתור "שחקו" בצד אחד, ומספר הנכנסים (עין ומספר) בצד השני */
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 7px; }
  .actions .play { margin-top: 0; }
  .seen { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: .9rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .seen svg { width: 16px; height: 16px; flex: none; }
  .seen[hidden] { display: none; }
  @keyframes wiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  /* כרטיס "בקרוב" */
  .soon { background: rgba(255,255,255,.65); border-style: dashed; box-shadow: none; cursor: default; }
  .soon:hover { transform: rotate(var(--tilt)); box-shadow: none; }
  .soon .thumb { display: grid; place-items: center; aspect-ratio: 400 / 240; background: transparent; }
  .soon .q { font-family: var(--display); font-size: 3.3rem; color: var(--grape); line-height: 1; }
  .soon .play { background: var(--paper); box-shadow: none; }

  /* כפתור "מי אני" צבעוני בראש הדף */
  .topbar { display: flex; justify-content: center; padding-top: 18px; }
  .who {
    display: inline-block; text-decoration: none; color: var(--ink);
    font-family: var(--display); font-size: 1.25rem; line-height: 1;
    padding: 10px 26px;
    background: linear-gradient(90deg, var(--pink), var(--sun), var(--mint), var(--grape));
    border: 3px solid var(--ink); border-radius: 999px; box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(-2deg); transition: transform .18s ease, box-shadow .18s ease;
  }
  .who:hover, .who:focus-visible { transform: rotate(0deg) translateY(-3px); box-shadow: 6px 7px 0 var(--ink); }
  .who:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  footer { text-align: center; margin-top: 54px; font-weight: 700; }
  footer p { display: inline-block; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 22px; box-shadow: 4px 4px 0 var(--ink); margin: 0; }

  /* מונה מבקרים: מדבקה קבועה בצד ימין */
  .visitors {
    position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%) rotate(2deg);
    z-index: 20; min-width: 92px; text-align: center;
    background: var(--sun); color: var(--ink);
    border: 4px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--ink);
    padding: 10px 12px 12px;
  }
  .visitors small { display: block; font-weight: 700; font-size: .85rem; }
  .visitors b { display: block; font-family: var(--display); font-weight: 400; font-size: 2.1rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .visitors[hidden] { display: none; }
  @media (max-width: 700px) {
    .visitors { top: auto; bottom: max(10px, env(safe-area-inset-bottom, 0px)); transform: rotate(2deg); min-width: 0; padding: 6px 12px 8px; border-width: 3px; border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); }
    .visitors b { font-size: 1.5rem; }
    body { padding-bottom: 96px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<!-- מונה מבקרים: מוצג רק אחרי שהמספר מגיע מהשירות -->
<aside class="visitors" id="visitors" hidden aria-live="polite">
  <small>מבקרים באתר</small>
  <b id="visitorCount">0</b>
</aside>

<script>
  document.documentElement.lang = "he";
  document.documentElement.dir = "rtl";

  // ===== רשימת המשחקים =====
  // כדי להוסיף משחק: מעתיקים בלוק אחד (מ-{ עד },) ומשנים את הפרטים.
  //   name    = שם המשחק       creator = מי יצר אותו
  //   image   = התמונה הקטנה    url     = הדף של המשחק
  //   soon: true = כרטיס "בקרוב" שעוד אי אפשר לפתוח
  var games = [
    { key: "escape-room", name: "חדר הבריחה", creator: "ליב", image: "escape-room.svg", url: "escape-room.html" },
    { key: "magic-studio", name: "הסטודיו הקסום", creator: "ליב", image: "magic-studio.svg", url: "magic-studio.html" },
    { key: "cake-bakery", name: "מאפיית העוגות", creator: "ליב", image: "cake-bakery.svg", url: "cake-bakery.html" },
    { key: "my-zoo", name: "גן החיות שלי", creator: "ליב", image: "my-zoo.svg", url: "my-zoo.html" },
    { key: "animal-salon", name: "מספרת החיות", creator: "ליב", image: "animal-salon.svg", url: "animal-salon.html" },
    { key: "dressup-city", name: "משחק לבוש", creator: "ליב", image: "dressup-city.svg", url: "dressup-city.html" },
    { key: "dream-in-dream", name: "חלום בחלום", creator: "ליב", image: "dream-in-dream.svg", url: "dream-house.html" },
    { key: "luna-game",      name: "החנות של לונה",     creator: "ליב", image: "luna-game.svg",     url: "luna-game.html" },
    { key: "space-shooter",  name: "מגן החלל",          creator: "ליב", image: "space-shooter.svg", url: "space-shooter.html" },
    { key: "cube-world",     name: "עולם הקוביות",      creator: "ליב", image: "cube-world.svg",    url: "https://ozcarmel.github.io/cube_world/" },
    { key: "cops-and-robbers", name: "שוטרים וגנבים",   creator: "גאיה", image: "cops-and-robbers.svg", url: "cops-and-robbers.html" },
    { key: "build-house",    name: "בונים בית",         creator: "ליב", image: "build-house.svg",   url: "build-house.html" },
    { key: "flashcards",     name: "קופסת הכרטיסיות",   creator: "ליב", image: "flashcards.svg",    url: "flashcards.html" },
    { key: "panda",          name: "משחק פנדה",         creator: "ליב", image: "panda.svg",         url: "panda.html" },
    { key: "star-gardener",  name: "הגנן של הכוכבים",   creator: "עוז", image: "star-gardener.svg", url: "star-gardener.html" },
    { key: "lemonade-stand", name: "דוכן לימונדה",      creator: "ליב", image: "lemonade-stand.svg", url: "lemonade-stand.html" },
    { key: "leaf-cleaners",  name: "מנקי העלים",        creator: "מיקה", image: "leaf-cleaners.svg", url: "leaf-cleaners.html" },
    { key: "penalty-kicks",  name: "בעיטות לשער",       creator: "עוז", image: "penalty-kicks.svg", url: "penalty-kicks.html" },
    { key: "squishy-factory", name: "מפעל הסקווישים",  creator: "ליב", image: "squishy-factory.svg", url: "squishy-factory.html" },
    { key: "design-apartment", name: "מעצבים דירה",    creator: "ליב", image: "design-apartment.svg", url: "design-apartment.html" },
    { key: "rage-room",      name: "חדר זעם",           creator: "ליב", image: "rage-room.svg",     url: "rage-room.html" },
    { key: "territory-3d",   name: "כובשי השטח 3D",    creator: "גילי", image: "territory-3d.svg", url: "territory-3d.html" }
  ];

  // ===== הכותרת הצבעונית: כל אות בצבע אחר =====
  var colors = ["#ffd23f", "#ff5fa2", "#ffffff", "#7a5cff", "#2fd1a0"];
  var title = document.getElementById("title");
  var text = title.textContent, i = 0;
  title.textContent = "";
  title.setAttribute("aria-label", text);
  text.split("").forEach(function (ch, n) {
    var s = document.createElement("span");
    s.textContent = ch === " " ? " " : ch;
    s.setAttribute("aria-hidden", "true");
    if (ch !== " ") { s.style.color = colors[i++ % colors.length]; }
    if (n % 3 === 0) { s.className = "bounce"; s.style.animationDelay = (n * 0.12) + "s"; }
    title.appendChild(s);
  });

  // ===== ציור הכרטיסים =====
  var grid = document.getElementById("games");
  var ready = 0;
  games.forEach(function (g) {
    var card = document.createElement(g.soon ? "div" : "a");
    card.className = "card" + (g.soon ? " soon" : "");
    if (!g.soon) { card.href = g.url; card.target = "_blank"; card.rel = "noopener"; ready++; }
    var thumb = g.soon
      ? '<div class="thumb"><span class="q">?</span></div>'
      : '<div class="thumb"><img src="' + g.image + '" alt="" width="400" height="240" loading="lazy"></div>';
    // ליד כפתור "שחקו" יש עין ומספר: כמה אנשים נכנסו למשחק (מוצג רק אחרי שהמספר מגיע)
    var seen = g.soon ? "" :
      '<span class="seen" hidden>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>' +
        '<span class="n"></span></span>';
    card.innerHTML = thumb +
      '<div class="info"><h3></h3><p class="by">נוצר על ידי <b></b></p>' +
      '<div class="actions"><span class="play">' + (g.soon ? "בקרוב" : "שחקו!") + '</span>' + seen + '</div></div>';
    card.querySelector("h3").textContent = g.name;
    var im = card.querySelector("img"); if (im) im.alt = "תמונה מהמשחק " + g.name;
    card.querySelector("b").textContent = g.creator;
    grid.appendChild(card);
    if (!g.soon) trackGame(g, card);
  });
  document.getElementById("count").textContent = ready + " משחקים";

  // ===== מונה נכנסים לכל משחק =====
  // אותו שירות חינמי של המונה הכללי, עם מפתח נפרד לכל משחק.
  // כל דפדפן נספר פעם אחת לכל משחק: כשלוחצים על הכרטיס מוסיפים 1, ובשאר הזמן רק קוראים את המספר.
  // אם השירות לא עונה, המספר פשוט לא מוצג והאתר ממשיך לעבוד.
  function trackGame(g, card) {
    var base = "https://abacus.jasoncameron.dev/", ns = "ozcarmel-liv-games", key = "game-" + g.key;
    var storeKey = "livGamesPlayed:" + g.key;
    var box = card.querySelector(".seen"), num = card.querySelector(".n");
    var current = null; // המספר שמוצג עכשיו
    // מספר התחלה קבוע לכל משחק (נבחר באקראי בין 30 ל־160), והמונה עולה משם כרגיל.
    // משחק חדש שלא ברשימה מקבל מספר קבוע בטווח הזה לפי השם שלו.
    var startAt = { "escape-room": 157, "magic-studio": 87, "cake-bakery": 50, "my-zoo": 72, "animal-salon": 109, "dressup-city": 61, "dream-in-dream": 102, "luna-game": 112, "space-shooter": 146, "cube-world": 47, "cops-and-robbers": 101, "build-house": 125, "flashcards": 130, "panda": 61, "star-gardener": 71, "lemonade-stand": 119, "leaf-cleaners": 144, "penalty-kicks": 132, "squishy-factory": 106, "design-apartment": 58, "rage-room": 32, "territory-3d": 129 };
    var offset = startAt[g.key];
    if (typeof offset !== "number") { offset = 0; for (var i = 0; i < g.key.length; i++) offset = (offset * 31 + g.key.charCodeAt(i)) % 131; offset += 30; }

    function show(n) {
      if (typeof n !== "number") return;
      n += offset;
      current = n;
      num.textContent = n.toLocaleString("he-IL");
      box.setAttribute("aria-label", "מספר הנכנסים למשחק: " + n.toLocaleString("he-IL"));
      box.hidden = false;
    }
    function played() { try { return localStorage.getItem(storeKey) === "1"; } catch (e) { return false; } }

    // בטעינת העמוד: קוראים את המספר. אם עוד אף אחד לא נכנס למשחק, המשחק עוד לא קיים בשירות ומציגים 0
    fetch(base + "get/" + ns + "/" + key).then(function (r) {
      if (r.status === 404) return { value: 0 };
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) { show(d.value); }).catch(function () {});

    // בלחיצה על הכרטיס (גם לחיצה אמצעית): סופרים פעם אחת לכל דפדפן
    function onOpen() {
      if (played()) return;
      try { localStorage.setItem(storeKey, "1"); } catch (e) {}
      fetch(base + "hit/" + ns + "/" + key, { keepalive: true }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function (d) { show(d.value); }).catch(function () {
        // לא הצליח לספור: מאפשרים לנסות שוב בפעם הבאה
        try { localStorage.removeItem(storeKey); } catch (e) {}
      });
    }
    card.addEventListener("click", onOpen);
    card.addEventListener("auxclick", onOpen);
  }

  // ===== מונה מבקרים =====
  // שירות חינמי (abacus.jasoncameron.dev) סופר ביקורים. כל דפדפן נספר פעם אחת בלבד:
  // בכניסה הראשונה מוסיפים 1, ובכניסות הבאות רק קוראים את המספר.
  // אם השירות לא עונה, המונה פשוט לא מוצג והאתר ממשיך לעבוד.
  (function () {
    var base = "https://abacus.jasoncameron.dev/", path = "ozcarmel-liv-games/visits";
    var counted = false;
    var START = 669; // השירות היה על 71 כשהוספנו את זה, אז 71+669 = 740
    try { counted = localStorage.getItem("livGamesCounted") === "1"; } catch (e) {}
    function show(n) {
      if (typeof n !== "number") return;
      n += START; // כך המונה מתחיל מ־740 ועולה משם
      document.getElementById("visitorCount").textContent = n.toLocaleString("he-IL");
      document.getElementById("visitors").hidden = false;
    }
    function call(action) {
      return fetch(base + action + "/" + path).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
    }
    var first = counted ? call("get").catch(function () { return call("hit"); }) : call("hit");
    first.then(function (d) {
      show(d.value);
      if (!counted) { try { localStorage.setItem("livGamesCounted", "1"); } catch (e) {} }
    }).catch(function () {});
  })();
</script>
